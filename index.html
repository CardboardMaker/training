          ${rteToolbar('example')}
          <div class="rte" id="rte-example" contenteditable="true">${sanitizeRTE(l.exampleHTML)}</div>
        </div>

        <div class="field">
          <label>Media</label>
          <div class="media-tabs">
            <button data-mtab="image" class="active">Image</button>
            <button data-mtab="video">Video</button>
            <button data-mtab="none">None</button>
          </div>
          <div id="media-panel-image" class="media-panel">
            <input type="url" id="img-url" placeholder="Paste an image URL…" value="${l.media && l.media.type==='image' ? l.media.src : ''}">
            <div class="hint-box">Or upload a small image directly (recommended under ~3MB).</div>
            <input type="file" id="img-file" accept="image/*" style="margin-top:8px;">
            <div style="margin-top:12px;">
              <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:6px;">Layout</label>
              <div class="align-group" id="img-align-group">
                <button data-align="left" class="${(l.media && l.media.align)==='left'?'active':''}">Left</button>
                <button data-align="center" class="${!l.media || !l.media.align || l.media.align==='center' ? 'active':''}">Center</button>
                <button data-align="right" class="${(l.media && l.media.align)==='right'?'active':''}">Right</button>
                <button data-align="full" class="${(l.media && l.media.align)==='full'?'active':''}">Full width</button>
              </div>
            </div>
          </div>
          <div id="media-panel-video" class="media-panel" style="display:none;">
            <input type="url" id="video-url" placeholder="Paste a YouTube, Vimeo, or direct video (.mp4) link…" value="${l.media && l.media.type==='video' ? l.media.src : ''}">
            <div class="hint-box">Recommended — links work at any length/size. Direct file upload below is capped to small clips only.</div>
            <input type="file" id="video-file" accept="video/*" style="margin-top:8px;">
          </div>
          <div class="media-preview" id="media-preview">${mediaHTML(l.media) || '<em style="color:var(--ink-soft);font-size:13px;">No media yet</em>'}</div>
        </div>

        <div class="field">
          <label>Attachment (downloadable file)</label>
          <input type="text" id="file-name" placeholder="Display name, e.g. Worksheet.pdf" value="${escapeHTML(l.file ? l.file.name : '')}">
          <input type="url" id="file-url" placeholder="Paste a hosted file URL…" value="${l.file && !String(l.file.src).startsWith('data:') ? l.file.src : ''}" style="margin-top:8px;">
          <div class="hint-box">Or upload a small file directly (recommended under ~3.5MB) — PDFs, worksheets, templates, etc.</div>
          <input type="file" id="file-upload" style="margin-top:8px;">
          <div class="media-preview" id="file-preview">${fileHTML(l.file) || '<em style="color:var(--ink-soft);font-size:13px;">No file attached</em>'}</div>
          <button class="btn btn-sm" id="file-remove" style="margin-top:10px;">Remove attachment</button>
        </div>

        <div class="action-row">
          <button class="btn btn-primary" id="save-lesson">Save</button>
          <button class="btn" id="cancel-edit-lesson">Cancel</button>

        </div>
      </div>
    </div>
  `;

  // pending media state
  let pendingMedia = l.media ? JSON.parse(JSON.stringify(l.media)) : null;
  let activeMediaTab = pendingMedia ? pendingMedia.type : 'image';
  setMediaTab(activeMediaTab);

  function setMediaTab(tab){
    activeMediaTab = tab;
    main.querySelectorAll('[data-mtab]').forEach(b => b.classList.toggle('active', b.dataset.mtab === tab));
    main.querySelector('#media-panel-image').style.display = tab === 'image' ? 'block' : 'none';
    main.querySelector('#media-panel-video').style.display = tab === 'video' ? 'block' : 'none';
  }
  main.querySelectorAll('[data-mtab]').forEach(b => b.addEventListener('click', () => setMediaTab(b.dataset.mtab)));

  main.querySelector('#img-url').addEventListener('input', (e) => {
    const align = pendingMedia && pendingMedia.type==='image' ? pendingMedia.align : 'center';

    if(file.size > 3.5 * 1024 * 1024){
      showAlert('That image is over ~3.5MB, which is too large for this preview storage. Try a smaller file or paste an image URL instead.');
      e.target.value = '';
      return;
    }
    const align = pendingMedia && pendingMedia.type==='image' ? pendingMedia.align : 'center';
    const reader = new FileReader();
    reader.onload = () => {
      pendingMedia = { type:'image', src: reader.result, alt: l.title, align };
      updatePreview();
    };
    reader.readAsDataURL(file);
  });
  main.querySelectorAll('#img-align-group button').forEach(b => {
    b.addEventListener('click', () => {
      main.querySelectorAll('#img-align-group button').forEach(x => x.classList.remove('active'));

        pendingMedia.align = b.dataset.align;
        updatePreview();
      }
    });
  });
  main.querySelector('#video-url').addEventListener('input', (e) => {
    pendingMedia = e.target.value ? { type:'video', src: e.target.value } : null;
    updatePreview();
  });
  main.querySelector('#video-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 3.5 * 1024 * 1024){
      showAlert('That video is over ~3.5MB, which is too large for this preview storage. Please paste a hosted video link instead (YouTube, Vimeo, or a direct .mp4 URL).');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingMedia = { type:'video', src: reader.result };
      updatePreview();
    };
    reader.readAsDataURL(file);
  });
  function updatePreview(){
    main.querySelector('#media-preview').innerHTML = mediaHTML(pendingMedia) || '<em style="color:var(--ink-soft);font-size:13px;">No media yet</em>';
  }

  // pending attachment (downloadable file) state
  let pendingFile = l.file ? JSON.parse(JSON.stringify(l.file)) : null;
  function updateFilePreview(){
    main.querySelector('#file-preview').innerHTML = fileHTML(pendingFile) || '<em style="color:var(--ink-soft);font-size:13px;">No file attached</em>';
  }
  main.querySelector('#file-name').addEventListener('input', (e) => {
    if(!pendingFile) pendingFile = { name:'', src:'' };
    pendingFile.name = e.target.value;
    updateFilePreview();
  });
  main.querySelector('#file-url').addEventListener('input', (e) => {
    if(!pendingFile) pendingFile = { name:'', src:'' };
    pendingFile.src = e.target.value;
    if(!pendingFile.name) pendingFile.name = e.target.value.split('/').pop() || 'file';
    updateFilePreview();
  });
  main.querySelector('#file-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 3.5 * 1024 * 1024){
      showAlert('That file is over ~3.5MB, which is too large for this preview storage. Try a smaller file or paste a hosted link instead.');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingFile = { name: main.querySelector('#file-name').value || file.name, src: reader.result };
      main.querySelector('#file-name').value = pendingFile.name;
      updateFilePreview();
    };
    reader.readAsDataURL(file);
  });
  main.querySelector('#file-remove').addEventListener('click', () => {
    pendingFile = null;
    main.querySelector('#file-name').value = '';
    main.querySelector('#file-url').value = '';
    updateFilePreview();
  });

  // style controls (title/subtitle align + color)
  wireStyleControls(main, 'title', l);
  wireStyleControls(main, 'subtitle', l);

  // rich text toolbars
  wireRTEToolbar(main, 'learn');
  wireRTEToolbar(main, 'example');
  main.querySelectorAll('.rte').forEach(el => {
    el.addEventListener('focus', () => { activeRTE = el; });
  });

  main.querySelector('#save-lesson').addEventListener('click', async () => {
    l.title = escapeHTML(main.querySelector('#f-title').value || l.title);
    l.subtitle = main.querySelector('#f-subtitle').value;
    l.learnHTML = sanitizeRTE(main.querySelector('#rte-learn').innerHTML);
    l.exampleHTML = sanitizeRTE(main.querySelector('#rte-example').innerHTML);
    l.media = pendingMedia;
    l.file = (pendingFile && pendingFile.src) ? pendingFile : null;
    l.updatedAt = Date.now();
    logActivity(state.currentUser, `Edited lesson "${l.title.replace(/&amp;/g,'&')}"`);
    await persist();
    state.pub.modal = { mi, li, editing: false };
    renderModal();
    if(state.pub.page === 'modules') renderSidePanel();
  });
  main.querySelector('#cancel-edit-lesson').addEventListener('click', () => {
    state.pub.modal = { mi, li, editing: false };
    renderModal();
  });
  main.querySelector('#del-lesson-btn').addEventListener('click', () => {
    showConfirm('Delete this lesson?', async () => {
      const title = l.title.replace(/&amp;/g,'&');
      m.lessons.splice(li, 1);
      logActivity(state.currentUser, `Deleted lesson "${title}"`);
      await persist();
      state.pub.modal = null;
      renderModal();
      if(state.pub.page === 'modules') renderSidePanel();
    }, 'Delete lesson');
  });
}

/* ---------- click delegation ---------- */
function handlePublicClick(e){
  const viewAsToggle = e.target.closest('[data-rail="toggle-view-as"]');
  if(viewAsToggle){
    state.viewAsUser = !state.viewAsUser;
    logActivity(state.currentUser, state.viewAsUser ? 'Started previewing as a regular user' : 'Exited user preview');
    renderPublic();
    return;
  }

  const railItem = e.target.closest('.rail-item');
  if(railItem){
    state.pub.page = railItem.dataset.rail;
    renderPublic();
    return;
  }

  const editModBtn = e.target.closest('[data-edit-module]');
  if(editModBtn){
    const mi = Number(editModBtn.dataset.editModule);
    showModuleEditPopup(state.modules[mi], mi);
    return;
  }

  const card = e.target.closest('.mod-card');
  if(card){
    state.pub.module = Number(card.dataset.mi);
    renderCardGrid();
    renderSidePanel();
    return;
  }

  const tocItem = e.target.closest('[data-open-lesson]');
  if(tocItem){
    const [mi, li] = tocItem.dataset.openLesson.split('-').map(Number);
    state.pub.modal = { mi, li, editing: false };
    renderModal();
    return;
  }

  const editLessonBtn = e.target.closest('[data-edit-lesson]');
  if(editLessonBtn){
    const [mi, li] = editLessonBtn.dataset.editLesson.split('-').map(Number);
    state.pub.modal = { mi, li, editing: true };
    renderModal();
    return;
  }

  const markBtn = e.target.closest('[data-mark-done]');
  if(markBtn){
    toggleDoneKey(markBtn.dataset.markDone);
    renderModal();
    if(state.pub.page === 'modules') renderSidePanel();
    return;
  }

  if(e.target.matches('[data-close-modal]')){
    state.pub.modal = null;
    renderModal();
    return;
  }

  const calNav = e.target.closest('[data-action="cal-prev"], [data-action="cal-next"]');
  if(calNav){
    const dir = calNav.dataset.action === 'cal-prev' ? -1 : 1;
    let mo = state.pub.calMonth + dir, yr = state.pub.calYear;
    if(mo < 0){ mo = 11; yr--; } if(mo > 11){ mo = 0; yr++; }
    state.pub.calMonth = mo; state.pub.calYear = yr;
    renderCalendarPage();
    return;
  }
  const dayCell = e.target.closest('.cal-grid .day');
  if(dayCell && dayCell.dataset.day){
    showDayModal(dayCell.dataset.day);
    return;
  }

  const openAddBtn = e.target.closest('[data-action="open-add-todo"]');
  if(openAddBtn){
    state.pub.todoAdding = true;
    const row = document.getElementById('todo-add-row');
    if(row){
      row.innerHTML = `
        <div class="todo-add-inline">
          <input type="text" id="todo-input" placeholder="Add a task…">
          <button class="btn btn-sm btn-primary" data-action="submit-todo">Add</button>
        </div>`;
      wireTodoWidget();
    }
    return;
  }
  const submitAddBtn = e.target.closest('[data-action="submit-todo"]');
  if(submitAddBtn){
    const input = document.getElementById('todo-input');
    const text = input.value.trim();
    if(text) state.currentUser.todos.push({ id: uid(), text, done:false, priority:'med' });
    state.pub.todoAdding = false;
    renderCalendarSide();
    return;
  }
  const todoToggle = e.target.closest('[data-toggle-todo]');
  if(todoToggle){
    const t = state.currentUser.todos.find(x => x.id === todoToggle.dataset.toggleTodo);
    if(t) t.done = !t.done;
    renderTodoList();
    return;
  }
  const todoDel = e.target.closest('[data-del-todo]');
  if(todoDel){
    state.currentUser.todos = state.currentUser.todos.filter(x => x.id !== todoDel.dataset.delTodo);
    renderTodoList();
    return;
  }
  const priorityMeta = e.target.closest('[data-cycle-priority]');
  if(priorityMeta){
    const t = state.currentUser.todos.find(x => x.id === priorityMeta.dataset.cyclePriority);
    if(t){
      const i = PRIORITY_CYCLE.indexOf(t.priority || 'med');
      t.priority = PRIORITY_CYCLE[(i + 1) % PRIORITY_CYCLE.length];
    }
    renderTodoList();
    return;
  }
}

function renderLoginPage(){
  document.body.className = 'learner-login-body';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="ll-wrap">
      <div class="ll-card">
        <div class="ll-visual">
          <div class="ll-tag">
            <p class="ll-tag-eyebrow">You can easily</p>
            <p class="ll-tag-title">Get access to your Cardboard Maker training, anytime.</p>
          </div>
        </div>
        <div class="ll-form-side">
          <h2>Log in to continue</h2>
          <p class="ll-sub">One login for everyone — admins just see extra editing tools once they're in.</p>
          <form id="login-form">
            <label>Username</label>
            <input type="text" id="ll-user" autocomplete="username" required>
            <label>Password</label>
            <div class="ll-pass-wrap">
              <input type="password" id="ll-pass" autocomplete="current-password" required>
              <button type="button" class="ll-eye" id="ll-eye" title="Show password">👁</button>
            </div>
            <div class="error" id="ll-error">${state.loginError}</div>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
          </form>
          <p class="ll-footnote">Don't have an account? <span class="ll-link">Ask your admin to add you.</span></p>
          <div class="hint" style="margin-top:14px;">Demo login: <strong>educator</strong> / <strong>cardboard2026</strong></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('ll-eye').addEventListener('click', () => {
    const pass = document.getElementById('ll-pass');
    pass.type = pass.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('ll-user').value.trim();
    const password = document.getElementById('ll-pass').value;
    const match = state.users.find(u => u.username === username && u.password === password);
    if(match){
      state.loggedIn = true;
      state.loginError = '';
      state.currentUser = match;
      if(!state.pub) state.pub = defaultPubState();
      logActivity(match, 'Logged in');
      await storageSet('current-session', { userId: match.id }, false);
      render();
    } else {
      state.loginError = 'Incorrect username or password.';
      render();
    }
  });
}

/* ============================================================
   ADMIN — DASHBOARD
   ============================================================ */
let activeRTE = null; // last-focused contenteditable, for toolbar commands

function styleControls(field, align, color){
  return `
    <div class="style-row">
      <div class="align-group" data-align-for="${field}">
        <button data-align="left" class="${align==='left'||!align?'active':''}">⟸</button>
        <button data-align="center" class="${align==='center'?'active':''}">≡</button>
        <button data-align="right" class="${align==='right'?'active':''}">⟹</button>
      </div>
      <div class="swatch-row" data-color-for="${field}">
        ${SWATCHES.map(c => `<button class="swatch ${color===c?'active':''}" data-color="${c}" style="background:${c||'#fff'}"></button>`).join('')}
        <input type="color" data-custom-for="${field}" value="${color || '#000000'}">
      </div>
    </div>
  `;
}
function wireStyleControls(main, field, l){
  const alignGroup = main.querySelector(`[data-align-for="${field}"]`);
  alignGroup.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      alignGroup.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      if(field==='title') l.titleAlign = btn.dataset.align; else l.subtitleAlign = btn.dataset.align;
    });
  });
  const colorRow = main.querySelector(`[data-color-for="${field}"]`);
  colorRow.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      colorRow.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
      if(field==='title') l.titleColor = sw.dataset.color; else l.subtitleColor = sw.dataset.color;
    });
  });
  colorRow.querySelector(`[data-custom-for="${field}"]`).addEventListener('input', (e) => {
    if(field==='title') l.titleColor = e.target.value; else l.subtitleColor = e.target.value;
  });
}

function rteToolbar(field){
  return `
    <div class="rte-toolbar" data-toolbar-for="${field}">
      <button class="wide" data-cmd="formatBlock" data-val="H3" title="Title block">Title</button>
      <button class="wide" data-cmd="formatBlock" data-val="H4" title="Subtitle block">Subtitle</button>
      <button class="wide" data-cmd="formatBlock" data-val="P" title="Body text">Text</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="Bold"><b>B</b></button>
      <button data-cmd="italic" title="Italic"><i>I</i></button>
      <button data-cmd="underline" title="Underline"><u>U</u></button>
      <button data-cmd="justifyLeft" title="Align left">⟸</button>
      <button data-cmd="justifyCenter" title="Align center">≡</button>
      <button data-cmd="justifyRight" title="Align right">⟹</button>
      ${SWATCHES.filter(c=>c).map(c => `<button data-cmd="foreColor" data-val="${c}" style="background:${c};width:24px;height:24px;border-radius:50%;"></button>`).join('')}
      <button data-cmd="removeFormat" title="Clear formatting">⨯</button>
      <span class="sep"></span>
      <button class="wide" data-cmd="insertImageBlock" title="Insert a photo anywhere in this text">🖼 Photo</button>
    </div>
  `;
}
function wireRTEToolbar(main, field){
  const bar = main.querySelector(`[data-toolbar-for="${field}"]`);
  const rte = main.querySelector(`#rte-${field}`);
  bar.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      if(btn.dataset.cmd === 'insertImageBlock'){
        rte.focus();
        const sel = window.getSelection();
        let savedRange = null;
        if(sel.rangeCount > 0 && rte.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
        showImageInsertModal((html) => {
          rte.focus();
          if(savedRange){
            const sel2 = window.getSelection();
            sel2.removeAllRanges();
            sel2.addRange(savedRange);
          }
          document.execCommand('insertHTML', false, html);
        });
        return;
      }
      rte.focus();
      document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
    });
  });
}

function flashToast(id){
  const t = document.getElementById(id);
  if(!t) return;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- account settings ---------- */
const STATUS_OPTIONS = [
  { value:'', label:'Auto (from progress)' },
  { value:'admin', label:'Admin (special)' },
  { value:'pro', label:'Pro' },
  { value:'advance', label:'Advance' },
  { value:'intermediate', label:'Intermediate' },
  { value:'beginner', label:'Beginner' }
];

// Admin-only section appended to My Account — same page everyone sees,
// just with this extra block at the bottom for people who can manage users.
function renderUsersSection(wrap){
  if(!wrap) return;
  const rows = state.users.map(u => {
    const sm = statusMeta(userStatusKey(u));
    const prog = userProgress(u);
    return `
    <div class="user-row">
      <div class="user-row-info">
        <div class="user-row-name">${escapeHTML(u.name)} <span class="status-badge" style="background:${sm.color};color:${sm.fg};font-size:10px;padding:3px 9px;">${sm.label}</span></div>
        <div class="user-row-meta">@${escapeHTML(u.username)} · ${prog.pct}% complete (${prog.done}/${prog.total})${u.id===state.currentUser.id ? ' · this is you' : ''}</div>
      </div>
      <select class="status-select" data-status-for="${u.id}">
        ${STATUS_OPTIONS.map(o => `<option value="${o.value}" ${(u.statusOverride||'')===o.value ? 'selected':''}>${o.label}</option>`).join('')}
      </select>
      <button class="btn btn-sm" data-view-log="${u.id}">Activity</button>
      <button class="btn btn-sm" data-del-user="${u.id}" ${u.id===state.currentUser.id ? 'disabled title="You cannot remove your own account"' : ''}>Remove</button>
    </div>
  `;
  }).join('');

  wrap.innerHTML = `
    <h2 style="font-size:18px;margin:0 0 4px;">Platform users</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;">
      Status is calculated from each member's progress, but you can pin it manually here — including granting Admin,
      which unlocks these editing tools for them too.
    </p>

    <div class="user-list">
      ${rows || '<div class="admin-empty" style="padding:20px 0;">No users yet — add one below.</div>'}
    </div>

    <div style="margin-top:22px;">
      <h3 style="margin:0 0 14px;font-size:15px;">Add a user</h3>
      <div class="field"><label>Full name</label><input type="text" id="nu-name" placeholder="Jamie Lee"></div>
      <div class="field"><label>Username</label><input type="text" id="nu-username" placeholder="jamie"></div>
      <div class="field"><label>Password</label><input type="text" id="nu-password" placeholder="Choose a password"></div>
      <div class="action-row">
        <button class="btn btn-primary" id="add-user-btn">Add user</button>
        <span class="toast" id="toast-user">Added ✓</span>
      </div>
    </div>

    <div class="warn-box" style="margin-top:16px;">Reminder: like the login itself, this is a UI-level access list for this preview, not hardened production authentication (passwords aren't hashed, etc).</div>

    <div class="danger-zone">
      <button class="btn" id="reset-content-btn">Reset all module/lesson content to defaults</button>
    </div>
  `;

  wrap.querySelector('#reset-content-btn').addEventListener('click', () => {
    showConfirm('This replaces ALL modules and lessons with the original defaults. Continue?', async () => {
      state.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
      state.pub.module = 0;
      logActivity(state.currentUser, 'Reset all content to defaults');
      await persist();
      showAlert('All module and lesson content has been reset to defaults.');
    }, 'Reset content');
  });

  wrap.querySelector('#add-user-btn').addEventListener('click', async () => {
    const name = wrap.querySelector('#nu-name').value.trim();
    const username = wrap.querySelector('#nu-username').value.trim();
    const password = wrap.querySelector('#nu-password').value;
    if(!name || !username || !password){
      showAlert('Please fill in name, username, and password before adding a user.');
      return;
    }
    if(state.users.some(u => u.username === username)){
      showAlert('That username is already taken — pick a different one.');
      return;
    }
    const newUser = { id: uid(), name, username, password, completions:{}, statusOverride:null, avatar:null, todos:[], todoMemo:'', events:{}, activityLog:[] };
    state.users.push(newUser);
    logActivity(newUser, 'Account created by admin');
    logActivity(state.currentUser, `Added user "${name}"`);
    await persistUsers();
    flashToast('toast-user');
    renderUsersSection(wrap);
  });

  wrap.querySelectorAll('[data-status-for]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const u = state.users.find(x => x.id === sel.dataset.statusFor);
      if(!u) return;
      u.statusOverride = sel.value || null;
      logActivity(u, `Status set to "${sel.value ? statusMeta(sel.value).label : 'Auto'}" by admin`);
      logActivity(state.currentUser, `Changed ${u.name}'s status to "${sel.value ? statusMeta(sel.value).label : 'Auto'}"`);
      await persistUsers();
      renderUsersSection(wrap);
    });
  });

  wrap.querySelectorAll('[data-view-log]').forEach(btn => {
    btn.addEventListener('click', () => {
      const u = state.users.find(x => x.id === btn.dataset.viewLog);
      showActivityLog(u);
    });
  });

  wrap.querySelectorAll('[data-del-user]').forEach(btn => {
    if(btn.disabled) return;
    btn.addEventListener('click', () => {
      const u = state.users.find(x => x.id === btn.dataset.delUser);
      showConfirm(`Remove ${u ? u.name : 'this user'}? They won't be able to log in anymore.`, async () => {
        state.users = state.users.filter(x => x.id !== btn.dataset.delUser);
        logActivity(state.currentUser, `Removed user "${u ? u.name : ''}"`);
        await persistUsers();
        renderUsersSection(wrap);
      }, 'Remove user');
    });
  });
}
</script>
