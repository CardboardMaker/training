<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardboard Maker Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-note:#FFFFFF;
    --kraft:#A4DFDC;
    --kraft-dark:#000000;
    --ink:#000000;
    --ink-soft:#3A3A3A;
    --orange:#FF6300;
    --sky:#9EDBFF;
    --yellow:#FCDC67;
    --line: rgba(0,0,0,0.16);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    width:100%: height:100%; margin:0; background:var(--paper); color:var(--ink);
    font-family:'Quicksand', sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Quicksand', sans-serif; font-weight:700;}
  a{color:var(--orange);}
  button{font-family:inherit;}

  /* ============ PUBLIC SITE — DASHBOARD SHELL ============ */
  body.public-body{ 
  background:url("assets/image/craftpaper.png") center center / cover no-repeat fixed; position:relative; height:100vh;
              min-height:100vh; overflow:hidden; display:flex; flex-direction:column;}
  .dash-wrap{ position: relative; z-index: 1; width: 100%; max-width: 1280px; height: 100vh; box-sizing: border-box;
              margin: 0 auto; padding: 25px 20px; display: flex; align-items: center; justify-content: center;}
  .dash-card{ background:#f9f7ed; border-radius:28px; box-shadow:0 20px 30px -20px rgba(0,0,0,0.15);
              display:flex; overflow:hidden; aspect-ratio:16/9; width:100%;}
  .dash-content-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .dash-content-row{ flex:1; min-height:0; display:flex; }
  .preview-banner{
    flex:0 0 auto; background:var(--yellow); color:var(--ink); font-size:13px; font-weight:700;
    padding:10px 20px; display:flex; align-items:center; justify-content:center; gap:14px;
  }
  .preview-banner button{
    border:2px solid var(--ink); background:#fff; border-radius:100px; padding:4px 12px;
    font-weight:700; font-size:12px; cursor:pointer; font-family:inherit;
  }

  /* sidebar */
  .rail{ width:84px; flex:0 0 auto; background:#000; padding:26px 12px; display:flex; flex-direction:column; align-items:center; }
  .rail .cap svg{ display: none;}
  .rail .cap{ width: 34px; height: 34px; margin: 0 0 30px; background: url("assets/image/logo.png") center/contain no-repeat; }
  .rail-main{ display:flex; flex-direction:column; gap:6px; width:100%; align-items:center; }
  .rail-item{
    display:flex; align-items:center; justify-content:center; padding:13px; border-radius:12px; cursor:pointer;
    color:rgba(255,255,255,0.68); width:52px;
  }
  .rail-item svg{ width:20px; height:20px; flex-shrink:0; }
  .rail-avatar{ width:26px; height:26px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .rail-item:hover{ background:rgba(255,255,255,0.07); color:#fff; }
  .rail-item.active{ background:var(--orange); color:#fff; }
  .rail-item.view-as-active{ background:var(--yellow); color:#000; }
  .rail-spacer{ flex:1; }
  .rail-bottom{ border-top:1px solid rgba(255,255,255,0.15); padding-top:10px; margin-top:8px; display:flex; flex-direction:column; gap:6px; width:100%; align-items:center; }
  .rail-version{ color:rgba(255,255,255,0.32); font-size:10px; text-align:center; padding-top:6px; }

  /* main pane */
  .dash-main{ flex:1; min-width:0; background:#ffffff; padding:38px 34px; overflow-y:auto; display:flex; flex-direction:column; }
  .dash-hello{ flex:0 0 auto; }
  .dash-hello h1{ margin:0 0 4px; font-size:30px; }
  .dash-hello-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .dash-hello-row h1{ margin:0 0 4px; }
  .status-badge{ display:inline-block; padding:5px 13px; border-radius:100px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .dash-hello p{ margin:0 0 22px; color:var(--ink-soft); font-size:15px; }
  .dash-search-row{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .dash-search-row .dash-search{ flex:1; margin-bottom:0; }
  .dash-search{ position:relative; flex:0 0 auto; }
  .dash-search input{
    width:100%; padding:13px 16px 13px 42px; border-radius:14px; border:1px solid var(--line);
    background:#fff; font-family:inherit; font-size:14px;
  }
  .dash-search .ic{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:15px; }

  .card-grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:18px;
    flex:1; min-height:0; overflow-y:auto; padding-right:6px; align-content:start;
  }
  .mod-card{
    border-radius:20px; padding:22px; cursor:pointer; position:relative; overflow:hidden;
    min-height:150px; border:2px solid transparent; transition:transform .15s ease;
  }
  .mod-card:hover{ transform:translateY(-2px); }
  .mod-card.active{ border-color:var(--ink); }
  .mod-card h3{ margin:0 0 10px; font-size:19px; padding-right:26px; }
  .mod-card .stats{ font-size:12.5px; line-height:1.7; color:rgba(0,0,0,0.65); font-weight:600; }
  .mod-card .icon{ position:absolute; right:16px; bottom:12px; width:56px; height:56px; opacity:.9; }
  .mod-card-edit{
    position:absolute; top:14px; right:14px; border:none; background:rgba(255,255,255,0.7);
    border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:12px; line-height:1;
  }
  .mod-card-edit:hover{ background:#fff; }

  /* right panel (Modules page TOC) */
  .dash-side{ width:300px; flex:0 0 auto; padding:34px 26px; border-left:1px solid var(--line); overflow-y:auto; }
  .profile-row{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .avatar{
    width:52px; height:52px; border-radius:14px; background:var(--kraft); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; color:#000; overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .profile-row .who{ font-weight:700; font-size:14.5px; }
  .profile-row .role{ font-size:12px; color:var(--ink-soft); }
  .profile-progress{ margin-top:6px; }
  .profile-progress .lbl{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .profile-progress .bar{ height:5px; background:var(--line); border-radius:100px; margin-top:5px; overflow:hidden; }
  .profile-progress .bar > div{ height:100%; background:var(--orange); }

  .toc-heading{ font-size:20px; margin:0 0 2px; }
  .toc-sub{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin:0 0 18px; }
  .toc-item{ display:flex; align-items:flex-start; gap:12px; padding:10px 6px; border-radius:10px; cursor:pointer; }
  .toc-item:hover{ background:rgba(164,223,220,0.2); }
  .toc-item .no{ font-size:26px; font-weight:700; color:var(--kraft); flex:0 0 auto; width:38px; line-height:1; }
  .toc-item .txt .t{ font-size:13.5px; font-weight:700; margin-bottom:2px; }
  .toc-item .txt .m{ font-size:11.5px; color:var(--ink-soft); }
  .toc-item.done .no{ color:var(--orange); }

  /* Me page */
  .me-progress-card{ background:#d9f4ef; border-radius:18px; padding:22px 24px; margin-bottom:22px; }
  .me-progress-top{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px; }
  .me-progress-top .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; }
  .me-progress-top .big{ font-size:30px; font-weight:700; line-height:1; margin-top:4px; }
  .me-progress-sub{ font-size:13px; color:var(--ink-soft); }
  .progress-bar-lg{ height:10px; border-radius:100px; background:var(--line); overflow:hidden; }
  .progress-bar-lg > div{ height:100%; background:var(--orange); border-radius:100px; }

  .me-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; }
  .me-card{ background:#d9f4ef; border-radius:16px; padding:20px; }
  .me-card-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--orange); font-weight:700; margin-bottom:8px; }
  .me-card-title{ font-size:16px; font-weight:700; margin-bottom:2px; }
  .me-card-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
  .me-external-card{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:0;
  }

  /* To-do widget (Calendar page, right column) — clean card style */
  .events-card{ background:#efebda; border-radius:16px; padding:20px 22px; margin-bottom:18px; }
  .events-card h4{ margin:0 0 12px; font-size:15px; }
  .event-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); }
  .event-row:last-child{ border-bottom:none; }
  .event-date{ color:var(--ink-soft); font-size:11.5px; white-space:nowrap; flex-shrink:0; }

  .todo-card{ background:#efebda; border-radius:16px; padding:20px 20px 18px; max-width:100%; box-sizing:border-box; }
  .todo-card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .todo-card-head h4{ margin:0; font-size:19px; font-weight:700; }
  .todo-card-sub{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:11.5px; color:var(--ink-soft); margin:6px 0 12px; flex-wrap:wrap; }

  .todo-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .todo-row:last-child{ border-bottom:none; }
  .todo-row-text{ flex:1; min-width:0; }
  .todo-row-title{ font-size:14px; font-weight:600; color:var(--ink); overflow-wrap:anywhere; }
  .todo-row.done .todo-row-title{ text-decoration:line-through; color:var(--ink-soft); }
  .todo-row-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; cursor:pointer; }
  .todo-row-meta:hover{ color:var(--orange); }

  .todo-check-circle{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:#00593f; background:#fff;
  }
  .todo-check-circle.done{ background:var(--kraft); border-color:var(--kraft); }
  .todo-del-x{ border:none; background:none; cursor:pointer; color:var(--line); font-size:12px; flex-shrink:0; padding:4px; }
  .todo-del-x:hover{ color:var(--orange); }

  .todo-add-row{ margin-top:6px; text-align:center; }
  .todo-add-trigger{
    border:none; background:none; cursor:pointer; font-weight:700; font-size:14px; color:var(--ink);
    padding:10px; display:inline-flex; align-items:center; gap:8px;
  }
  .todo-add-trigger:hover{ color:var(--orange); }
  .todo-add-inline{ display:flex; gap:8px; max-width:100%; }
  .todo-add-inline input{ flex:1; min-width:0; padding:9px 11px; border:2px solid var(--ink); border-radius:8px; font-family:inherit; font-size:13px; box-sizing:border-box; }

  .todo-memo{ margin-top:16px; border-top:1px solid var(--line); padding-top:14px; }
  .todo-memo-label{ color:var(--ink-soft); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .todo-memo textarea{ width:100%; min-height:56px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; resize:vertical; font-family:inherit; font-size:12.5px; box-sizing:border-box; }

  /* lesson popup modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-card{
    position:relative; background:#fff; border-radius:20px; width:min(760px, calc(100vw - 48px)); aspect-ratio:16 / 12;
    max-height:calc(100vh - 48px); box-sizing:border-box; padding:30px; overflow-y:auto; overflow-x:hidden;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%;
    border:2px solid var(--ink); background:#fff; cursor:pointer; font-weight:700; font-size:15px;
  }
  .modal-card .m-eyebrow{ font-size:11px; color:var(--orange); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin:0 0 6px; }
  .modal-top-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .modal-top-row .m-eyebrow{ margin:0 0 6px; }
  .modal-card h3{ margin:0 0 6px; font-size:21px; }
  .modal-card .m-subtitle{ margin:0 0 16px; color:var(--ink-soft); font-size:14px; }
  .modal-card .label{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--orange); margin:16px 0 6px; font-weight:700; }
  .modal-card .rte-view{ line-height:1.65; font-size:15px; }
  .modal-card .rte-view p{ margin:0 0 10px; }
  .modal-card .example{ border-top:2px dashed var(--line); padding-top:14px; margin-top:16px; }
  .modal-card .example .label{ color:var(--orange); }
  .modal-card .media-block{ margin:12px 0; }
  .modal-card .media-block::after{ content:""; display:table; clear:both; }
  .modal-card .media-block img{ border-radius:10px; }
  .modal-card .media-block video{ max-width:100%; border-radius:10px; display:block; }
  .modal-card .media-block iframe{ width:100%; aspect-ratio:16/9; border:0; border-radius:10px; display:block; }
  .file-attach{ margin:14px 0; }
  .file-attach a{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    background:var(--kraft); color:#000; font-weight:700; font-size:13.5px;
    padding:9px 16px; border-radius:100px; border:2px solid var(--ink);
  }
  .file-attach a:hover{ opacity:0.85; }
  .modal-mark{ margin-top:20px; text-align:left; }

  /* simple placeholder pages: account / calendar */
  .placeholder-page h1{ font-size:26px; margin:0 0 8px; }
  .placeholder-page p{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; max-width:480px; }
  .account-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; max-width:420px; margin-top:20px; }
  .account-card .field{ margin-bottom:14px; }
  .avatar-row{ display:flex; align-items:center; gap:18px; margin-bottom:20px; }
  .avatar-big{
    width:76px; height:76px; border-radius:50%; background:var(--kraft); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:22px; color:#000; overflow:hidden;
  }
  .avatar-big img{ width:100%; height:100%; object-fit:cover; }
  .status-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .status-row-sub{ font-size:12px; color:var(--ink-soft); }
  .activity-block{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line); }
  .activity-row{ display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line); }
  .activity-row:last-child{ border-bottom:none; }
  .activity-time{ color:var(--ink-soft); white-space:nowrap; flex-shrink:0; }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; max-width:520px; }
  .cal-nav{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:14px; }
  .cal-legend{ display:flex; gap:16px; font-size:12px; color:var(--ink-soft); margin:12px 0 4px; align-items:center; }
  .cal-legend span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .dot-mint{ background:var(--kraft); }
  .dot-orange{ background:var(--orange); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:16px; max-width:520px; }
  .cal-grid .dow{ font-size:11px; text-align:center; color:var(--ink-soft); font-weight:700; text-transform:uppercase; }
  .cal-grid .day{
    aspect-ratio:1; border-radius:8px; background:#fff; border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font-size:12.5px; cursor:pointer;
  }
  .cal-grid .day:hover{ border-color:var(--ink); }
  .cal-grid .day.today{ background:var(--orange); color:#fff; border-color:var(--orange); font-weight:700; }
  .cal-grid .day.blank{ border:none; cursor:default; }
  .cal-grid .day-dots{ display:flex; gap:3px; height:7px; }

  footer{ text-align:center; padding:20px 24px 10px; color:var(--ink-soft); font-size:12.5px; position:relative; z-index:1; }

  @media (max-width:900px){
    .dash-card{ flex-direction:column; aspect-ratio:auto; }
    .dash-content-row{ flex-direction:column; }
    .dash-main{ overflow-y:visible; }
    .card-grid{ overflow-y:visible; flex:none; }
    .rail{ width:100%; flex-direction:row; padding:12px 10px; align-items:center; flex-wrap:wrap; }
    .rail .cap{ margin:0 10px 0 0; }
    .rail-main, .rail-bottom{ flex-direction:row; border:none; margin:0; padding:0; }
    .rail-item{ padding:8px 10px; }
    .rail-spacer{ display:none; }
    .rail-version{ display:none; }
    .dash-side{ border-left:none; border-top:1px solid var(--line); width:100%; }
    .card-grid, .me-grid{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce){ .mod-card{ transition:none; } }

  /* ============ ADMIN ============ */
  .admin-login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:#000; padding:24px; }
  .login-card{ background:#fff; border-radius:10px; padding:36px 32px; width:100%; max-width:380px; box-shadow:0 30px 60px rgba(0,0,0,0.4); }
  .login-card h2{ margin:0 0 4px; font-size:22px; }
  .login-card .sub{ color:var(--ink-soft); font-size:13px; margin:0 0 24px; }
  .login-card label{ display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
  .login-card input{ width:100%; padding:11px 12px; border:2px solid var(--ink); border-radius:6px; font-family:inherit; font-size:14px; }
  .login-card .error{ color:var(--orange); font-size:13px; font-weight:600; margin-top:10px; min-height:16px; }
  .login-card .hint{ margin-top:20px; font-size:12px; color:var(--ink-soft); background:rgba(164,223,220,0.35); border-radius:6px; padding:10px 12px; }

  /* learner login (gates the public dashboard) */
  body.learner-login-body{ background: url("assets/image/craftpaper.png"); min-height:100vh; }
  .ll-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .ll-card{
    background:#fff; border-radius:28px; overflow:hidden; display:flex; max-width:840px; width:100%;
    min-height:520px; box-shadow:0 30px 70px -30px rgba(0,0,0,0.35);
  }
  .ll-visual{ flex:1; position:relative; padding:36px; display:flex; flex-direction:column; justify-content:space-between;
    background-image:url("assets/image/welcome.png"); background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .ll-tag-eyebrow{ font-size:13px; font-weight:600; margin:0 0 6px; color:#000; opacity:.75; }
  .ll-tag-title{ font-size:21px; font-weight:800; line-height:1.35; margin:0; max-width:260px; color:#000; }
  .ll-form-side{ flex:1; padding:44px 40px; display:flex; flex-direction:column; justify-content:center; }
  .ll-form-side h2{ margin:14px 0 6px; font-size:24px; }
  .ll-sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 22px; line-height:1.5; }
  .ll-form-side label{ display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
  .ll-form-side input[type=text], .ll-form-side input[type=password]{
    width:100%; padding:11px 12px; border:2px solid var(--ink); border-radius:8px; font-family:inherit; font-size:14px; box-sizing:border-box;
  }
  .ll-pass-wrap{ position:relative; }
  .ll-pass-wrap input{ padding-right:42px; }
  .ll-eye{ position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; font-size:15px; }
  .ll-form-side .error{ color:var(--orange); font-size:13px; font-weight:600; margin-top:10px; min-height:16px; }
  .ll-form-side .hint{ margin-top:14px; font-size:12px; color:var(--ink-soft); background:rgba(164,223,220,0.35); border-radius:6px; padding:10px 12px; }
  .ll-footnote{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:18px; }
  .ll-link{ color:var(--orange); font-weight:700; }
  @media (max-width:720px){
    .ll-card{ flex-direction:column; min-height:0; }
    .ll-visual{ min-height:170px; }
    .ll-form-side{ padding:32px 24px; }
  }

  .btn{ border-radius:100px; border:2px solid var(--ink); background:#fff; color:var(--ink); padding:9px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; }
  .btn:hover{ opacity:0.85; }
  .btn-primary{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .btn-block{ width:100%; margin-top:22px; }
  .btn-sm{ padding:5px 12px; font-size:12px; }

<script>
/* ============================================================
   STORAGE LAYER (artifact persistent storage, with in-memory
   fallback so the CMS still works if window.storage is absent)
   ============================================================ */
const memoryDB = {};
const hasStorage = (typeof window !== 'undefined' && !!window.storage);

async function storageGet(key, shared){
  if(hasStorage){
    try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  return memoryDB[key] !== undefined ? memoryDB[key] : null;
}
async function storageSet(key, value, shared){
  if(hasStorage){
    try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
    catch(e){ return false; }
  }
  memoryDB[key] = value;
  return true;
}

function escapeHTML(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
function sanitizeRTE(html){
  // strip script/style tags defensively; contenteditable output otherwise
  return (html || '').replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '');
}
function uid(){ return Math.random().toString(36).slice(2, 9); }

// Native confirm()/alert() are silently blocked inside sandboxed iframes
// (e.g. the Claude.ai artifact preview) unless "allow-modals" is set, which
// we can't rely on — so we build our own lightweight modal versions instead.
function showConfirm(message, onYes, confirmLabel){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${escapeHTML(message)}</p>
      <div class="confirm-actions">
        <button class="btn" data-confirm="cancel">Cancel</button>
        <button class="btn btn-primary" data-confirm="ok">${escapeHTML(confirmLabel || 'Confirm')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'cancel'){ overlay.remove(); return; }
    if(e.target.dataset.confirm === 'ok'){ overlay.remove(); onYes(); }
  });
}
function showAlert(message){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${escapeHTML(message)}</p>
      <div class="confirm-actions">
        <button class="btn btn-primary" data-confirm="ok">OK</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'ok') overlay.remove();
  });
}
function showActivityLog(user){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  const log = (user && user.activityLog) || [];
  overlay.innerHTML = `
    <div class="confirm-box" style="max-width:420px;text-align:left;max-height:70vh;overflow-y:auto;">
      <p style="font-weight:700;margin-bottom:4px;">${escapeHTML(user ? user.name : 'Activity')}</p>
      <p style="font-size:12px;color:var(--ink-soft);margin:0 0 14px;">Recent activity on this account</p>
      ${log.length ? log.map(e => `
        <div class="activity-row">
          <span>${escapeHTML(e.action)}</span>
          <span class="activity-time">${formatRelativeDate(e.ts)}</span>
        </div>`).join('') : '<div class="nav-empty" style="padding:10px 0;">Nothing logged yet.</div>'}
      <div class="confirm-actions" style="margin-top:16px;">
        <button class="btn" data-confirm="cancel">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'cancel') overlay.remove();
  });
}

// Admin's module editor — opens as an overlay right from the Modules page
// card grid, so editing happens in the same place content is browsed.
function showModuleEditPopup(m, mi){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box" style="max-width:420px;text-align:left;">
      <p style="font-weight:700;margin-bottom:14px;">Edit module</p>
      <div class="field"><label>Eyebrow label</label><input type="text" id="mod-eyebrow" value="${escapeHTML(m.eyebrow)}"></div>
      <div class="field"><label>Module title</label><input type="text" id="mod-title" value="${escapeHTML(m.title.replace(/&amp;/g,'&'))}"></div>
      <div class="field">
        <label>Accent color (card tint)</label>
        <div class="swatch-row" id="mod-accent-row">
          ${SWATCHES.map(c => `<button class="swatch ${m.accent===c?'active':''}" data-color="${c}" style="background:${c||'#A4DFDC'}"></button>`).join('')}
          <input type="color" id="mod-accent-custom" value="${m.accent || '#A4DFDC'}">
        </div>
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin:0 0 4px;">${m.lessons.length} lesson${m.lessons.length===1?'':'s'} in this module — add more from the lesson list on the right.</p>
      <div class="confirm-actions" style="justify-content:space-between;margin-top:16px;">
        <button class="btn" id="mod-delete-btn" style="border-color:var(--orange);color:var(--orange);">Delete module</button>
        <div style="display:flex;gap:10px;">
          <button class="btn" data-confirm="cancel">Cancel</button>
          <button class="btn btn-primary" id="mod-save-btn">Save</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  let pendingAccent = m.accent;
  overlay.querySelectorAll('#mod-accent-row .swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      pendingAccent = sw.dataset.color;
      overlay.querySelectorAll('#mod-accent-row .swatch').forEach(x => x.classList.remove('active'));
      sw.classList.add('active');
    });
  });
  overlay.querySelector('#mod-accent-custom').addEventListener('input', (e) => { pendingAccent = e.target.value; });

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'cancel') overlay.remove();
  });
  overlay.querySelector('#mod-save-btn').addEventListener('click', async () => {
    m.eyebrow = overlay.querySelector('#mod-eyebrow').value || m.eyebrow;
    m.title = escapeHTML(overlay.querySelector('#mod-title').value || m.title);
    m.accent = pendingAccent;
    logActivity(state.currentUser, `Edited module "${m.title}"`);
    await persist();
    overlay.remove();
    renderCardGrid();
    renderSidePanel();
  });
  overlay.querySelector('#mod-delete-btn').addEventListener('click', () => {
    showConfirm(`Delete "${m.title.replace(/&amp;/g,'&')}" and all its lessons?`, async () => {
      const idx = state.modules.indexOf(m);
      state.modules.splice(idx, 1);
      state.pub.module = Math.max(0, Math.min(state.pub.module, state.modules.length - 1));
      logActivity(state.currentUser, `Deleted module "${m.title}"`);
      await persist();
      overlay.remove();
      renderCardGrid();
      renderSidePanel();
    }, 'Delete module');
  });
}

// "🖼 Photo" toolbar button so photos can go anywhere in the text, not just
// in one fixed hero-media slot.
function showImageInsertModal(onInsert){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box" style="max-width:420px;">
      <p style="font-weight:700;">Insert a photo</p>
      <div class="field"><label>Image URL</label><input type="url" id="ins-img-url" placeholder="https://…"></div>
      <div class="hint-box">Or upload a small image (recommended under ~3MB)</div>
      <input type="file" id="ins-img-file" accept="image/*" style="margin:8px 0 4px;">
      <div class="field" style="margin-top:12px;">
        <label>Layout</label>
        <div class="align-group" id="ins-img-align">
          <button data-align="left" class="active">Left</button>
          <button data-align="center">Center</button>
          <button data-align="right">Right</button>
          <button data-align="full">Full width</button>
        </div>
      </div>
      <div class="confirm-actions">
        <button class="btn" data-confirm="cancel">Cancel</button>
        <button class="btn btn-primary" id="ins-img-go">Insert</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  let pendingSrc = '';
  let align = 'left';
  overlay.querySelector('#ins-img-url').addEventListener('input', (e) => { pendingSrc = e.target.value; });
  overlay.querySelector('#ins-img-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 3.5 * 1024 * 1024){
      showAlert('That image is over ~3.5MB — try a smaller file or paste an image URL instead.');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => { pendingSrc = reader.result; };
    reader.readAsDataURL(file);
  });
  overlay.querySelectorAll('#ins-img-align button').forEach(b => {
    b.addEventListener('click', () => {
      overlay.querySelectorAll('#ins-img-align button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      align = b.dataset.align;
    });
  });
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'cancel'){ overlay.remove(); }
  });
  overlay.querySelector('#ins-img-go').addEventListener('click', () => {
    if(!pendingSrc){ showAlert('Add an image URL or upload a file first.'); return; }
    let style = 'border-radius:8px;';
    if(align === 'left') style += 'float:left;max-width:45%;margin:4px 16px 10px 0;';
    else if(align === 'right') style += 'float:right;max-width:45%;margin:4px 0 10px 16px;';
    else if(align === 'full') style += 'display:block;width:100%;margin:12px 0;';
    else style += 'display:block;max-width:80%;margin:12px auto;';
    const html = `<img src="${pendingSrc}" style="${style}">`;
    overlay.remove();
    onInsert(html);
  });
}

/* ============================================================
   DEFAULT CONTENT
   ============================================================ */
function lesson(title, learn, example){
  return {
    id: uid(), title, subtitle: '',
    titleAlign: 'left', titleColor: '', subtitleAlign: 'left', subtitleColor: '',
    learnHTML: `<p>${escapeHTML(learn)}</p>`,
    exampleHTML: `<p>${escapeHTML(example)}</p>`,
    media: null,
    file: null,
    updatedAt: null
  };
}
// Renders an array of content "blocks" into HTML:
//  - a plain string -> <p>
//  - an array of strings -> <ul><li>
//  - {h, p} -> a bold sub-heading followed by its paragraph
  function blocksToHTML(blocks){
  return blocks.map(b => {
    // Bullet list
    if(Array.isArray(b)){
      return `<ul>${b.map(li => `<li>${escapeHTML(li)}</li>`).join('')}</ul>`;}
    // Photo
    if(b && typeof b === 'object' && b.type === 'photo'){
      const align = b.align || 'left';
      let style = 'border-radius:8px;';
      if(align === 'left'){ style += 'display:block;max-width:45%;margin:12px 16px 12px 0;'; }
      else if(align === 'right'){ style += 'display:block;max-width:45%;margin:12px 0 12px auto;';}
      else if(align === 'full'){ style += 'display:block;width:100%;margin:12px 0;';}
      else { style += 'display:block;max-width:80%;margin:12px auto;';}
      return `<img src="${escapeHTML(b.src)}" style="${style}" alt="${escapeHTML(b.alt || '')}">`;}
    // Attached file
    if(b && typeof b === 'object' && b.type === 'attach'){
      return `
        <div class="file-attach">
          <a href="${escapeHTML(b.src)}" download>
            📎 ${escapeHTML(b.label || 'Download File')}
          </a>
        </div>
      `;}
    // Heading + paragraph
    if(b && typeof b === 'object' && b.h){
      return `<p><strong>${escapeHTML(b.h)}</strong>${b.p ? '<br>'+escapeHTML(b.p) : ''}</p>`;}
    // Normal text
    return `<p>${escapeHTML(b)}</p>`;
  }).join('');
}
function richLesson(title, learnBlocks, exampleBlocks){
  return {
    id: uid(), title, subtitle: '',
    titleAlign: 'left', titleColor: '', subtitleAlign: 'left', subtitleColor: '',
    learnHTML: blocksToHTML(learnBlocks),
    exampleHTML: blocksToHTML(exampleBlocks),
    media: null,
    file: null,
    updatedAt: null
  };
}
function mod(eyebrow, title, lessons){
  return { id: uid(), eyebrow, title, accent: '', lessons };
}

        `Children develop belonging when they are invited into the process instead of simply being given instructions. Questions such as "What do you think?", "How should we solve this together?", or "Would you like to show us your idea?" help children feel that their opinions matter and that they are valued members of the group.`,
        `Facilitators play an important role in creating this culture. By encouraging collaboration, listening to children's ideas, and providing opportunities for every child to participate, they help build an environment where everyone feels respected and included.`,
        `Simple changes in wording can make a meaningful difference:`,
        { h: 'Instead of: "Now you need to do the floor plan."', p: 'Try: "How do you think we should plan the floor layout?"' },
        { h: 'Instead of: "Are you sure you can do it?"', p: 'Try: "Let\'s figure it out together."' },
        `A strong sense of belonging gives children the confidence to explore new ideas, ask questions, and take creative risks. It strengthens relationships within the group and creates a learning community where children feel connected, capable, and inspired to continue making together.`,
        `"A child belongs when their ideas, their voice, and their presence matter."`
      ],
      [`Encourage with words — rewrite these sentences to create more sense of belonging: "Are you sure you can do it?" · "You are too noisy, please be quiet." · "You need to do this welcome sign together."`]
    ),
    richLesson("Project-based Learning",
      [
        `Project-Based Learning (PBL) is an approach where children learn by working on meaningful projects that solve a problem, answer a question, or create something with a real purpose. Instead of learning one subject at a time, children bring together knowledge and skills from different areas as they work toward a shared goal.`,
        `A project begins with a challenge rather than a list of instructions. Children are encouraged to ask questions, generate ideas, make plans, build prototypes, test their solutions, and reflect on what they have learned. Throughout the process, facilitators guide learning by asking questions, providing resources, and supporting children's thinking instead of directing every step.`,
        `This approach can be applied even when teaching a simple skill. For example, instead of demonstrating how to bend cardboard, present the challenge: "How could you bend this piece of cardboard without cutting it?"`,
        `Children begin experimenting with different ideas. They fold it, roll it, score the surface, compare results, and discuss why some methods work better than others. After they have explored their own solutions, the facilitator introduces additional techniques and explains the science behind them. Because the children have already experienced the problem firsthand, the new knowledge becomes meaningful and memorable.`,
        `Every Cardboard Maker project follows the same philosophy. Children are given a design challenge rather than a fixed outcome. They plan, build, test, improve, and present their creations while naturally applying ideas from design, engineering, science, mathematics, art, and technology.`
      ],
      [
        `You are teaching children how to make a cardboard bridge. Your first instinct is to demonstrate each step: measure the cardboard, cut along the lines, fold the sides, glue the supports together.`,
        `Instead, you decide to teach using Project-Based Learning. Rewrite the lesson plan in a Project-based Learning approach.`
      ]
    ),
    richLesson("Crafter Community",
      [
        `Great ideas grow faster when they are shared. A Crafter Community is a learning environment where children help one another, exchange ideas, and celebrate different ways of making. Every child becomes both a learner and a contributor.`,
        `Creating this community starts with the facilitator. Instead of answering every question, encourage children to learn from one another. For example, instead of saying, "I'll show you how to make it," try asking, "Who has found a way to solve this?"`,
        `A child who has discovered a strong cardboard joint, a clever mechanism, or an effective painting technique can become the teacher for a moment. Sharing ideas helps the whole group grow while building confidence in the child who is demonstrating.`,
        `Small habits create a strong community:`,
        ['Invite children to walk around and observe each other\'s work.', 'Encourage them to ask questions before giving suggestions.', 'Celebrate different solutions instead of comparing whose project is "better."', 'Ask children to explain how they solved a problem so others can learn from their thinking.', 'Thank children who help their friends without taking over the project.'],
        `The facilitator's role is to connect children with one another rather than becoming the center of every conversation. When children begin saying, "Can I show you how I did it?" or "Let's solve it together," the community is learning from itself.`
      ],
      [`Write 5 open-ended questions you can ask during class to encourage children to share their ideas, discoveries, and experiences with one another. Your questions should invite discussion rather than lead to a single correct answer.`]
    ),
    richLesson("Common Challenges",
      [
        `Every making session is different. Children have different personalities, abilities, and ideas, so unexpected situations are part of the learning experience. A facilitator's role is to respond in ways that keep children engaged, confident, and motivated to continue creating.`,
        { h: 'Children are not listening and start running around', p: 'Children often lose focus when they have been listening for too long or are waiting with nothing to do. Instead of repeatedly asking for silence, regain their attention by making them part of the activity.' },
        ['Keep explanations short and begin making as soon as possible.', 'Give children a small task while you explain.', 'Use a countdown or a familiar class routine to gather attention.'],
        { h: 'Children struggle with the project', p: 'When children become frustrated, resist the urge to fix the project for them. Instead, help them break the challenge into smaller steps. Try asking: "What have you tried already?" or "What could we test first?" The goal is to help children experience success without taking ownership away from them.' },
        { h: 'Children are too young to complete the project independently', p: 'Young children still want ownership, even when they need support. Think of the project as something you build together, not something you build for them. Let children make as many decisions as possible: choose the colors, hold pieces while you glue, or test the mechanism.' },
        { h: 'Children want to build something beyond the available tools', p: 'Imagination often grows faster than available materials, and that is something to celebrate. Rather than saying, "We can\'t do that," try asking: "What could we build with the materials we have?" Children learn that innovation often begins by building the best possible solution with the resources available.' },
        { h: "Things don't go as planned", p: 'Projects may break. Materials may run out. Electronics may stop working. Children watch how facilitators respond to these moments. Stay calm and model problem-solving. You might say: "What do you think happened?" or "What\'s another way we could do this?"' }
      ],
      [`Reflect on a challenge you have experienced while working with children. Share how you handled it and discuss what you would do differently using the Cardboard Maker approach.`]
    )
  ]),
  mod("Module 03", "Core Competencies", [
    richLesson("Creative Design Competence",
      [
        `Creative design competence is the ability to understand problems, develop ideas, and communicate solutions through the design process. It helps children move from simply making objects to becoming thoughtful creators who can observe, imagine, test, and improve their ideas.`,
        { h: 'Design Thinking', p: 'Design Thinking is a human-centered process for creating solutions. It helps children look closely at a situation, understand people\'s needs, generate ideas, make something, and learn from testing it. The process can be introduced through five simple steps:' },
        ['Empathize — Understand Others', 'Define — Find the Challenge', 'Ideate — Imagine Possibilities', 'Prototype — Make the Idea Real', 'Test — Try, Learn, Improve'],
        `Testing often leads children back to an earlier step. They may redefine the challenge, create a new idea, or build another prototype. Design Thinking is a cycle, not a straight line.`,
        { h: 'Creative Problem Solving', p: 'Creative Problem Solving is the ability to approach challenges with imagination, explore different solutions, and improve ideas through experimentation. It helps children become flexible thinkers who can create solutions instead of waiting for answers.' },
        { h: 'Adaptability', p: 'Adaptability is the ability to respond to change, learn from experiences, and adjust ideas when situations change. It helps children become flexible thinkers who can approach challenges with curiosity instead of frustration. Children practice:' },
        ['Adjusting their plans when challenges appear.', 'Trying different approaches when the first idea does not work.', 'Improving their designs through testing and reflection.']
      ],
      [`Choose one Cardboard Maker project and describe how children use the three Creative Design Competence areas.`]
    ),
    richLesson("Engineering and Technology Competence",
      [
        `Engineering and Technology Competence is the ability to understand how things work, use tools and technologies effectively, and create solutions through designing, building, and testing. It helps children move from being passive users of technology to becoming confident creators who can explore, experiment, and shape the world around them.`,
        { h: 'Material Awareness', p: 'Material Awareness is the ability to understand the properties, limitations, and possibilities of different materials. Designers and engineers choose materials based on how they behave and how they support the purpose of a design. Children also learn how different tools and components work together:' },
        ['Cardboard creates the structure and physical form.', 'Electronic parts create interaction.', 'Tools help transform ideas into prototypes: cut, glue, assemble.'],
        { h: 'Interactive Mechanics', p: 'Interactive Mechanics is the ability to design how objects respond, move, and interact with people. In engineering and design, creating an interaction requires understanding the relationship between input, process, and output.' },
        ['Input — How does a person control the object?', 'Process — How does the system decide what to do?', 'Output — How does the object respond?'],
        { h: 'Computational Thinking', p: 'Computational Thinking is the ability to understand, use, and communicate with digital technologies. In a world where technology is increasingly connected to everyday life, children need opportunities to understand how digital systems work. It introduces children to computational thinking:' },
        ['Sequence — Understanding that instructions happen in order.', 'Logic — Creating conditions and responses.', 'Debugging — Finding and fixing mistakes.']
      ],
      [`Choose one Cardboard Maker project and describe how children use the three Engineering and Technology Competence areas.`]

    richLesson("Social and Collaboration Competence",
      [
        `Social and Collaboration Competence is the ability to communicate with others, work together toward a shared goal, and contribute ideas within a community. It helps children move from creating independently to becoming thoughtful collaborators who can listen, support, and learn from one another.`,
        { h: 'Initiative Skills', p: 'Initiative is the ability to take action, make decisions, and move ideas forward independently. It helps children become active contributors who are confident in exploring possibilities and taking responsibility for their work. Children practice:' },

        { h: 'Interpersonal Skills', p: 'Interpersonal Skills are the ability to communicate, understand, and build positive relationships with others. They help children express their ideas, listen to different perspectives, and work together respectfully. Children practice:' },
        ["Listening to others' ideas.", 'Asking questions and giving feedback.', 'Expressing their own thoughts and needs.', 'Respecting different approaches and opinions.'],
        { h: 'Presentation Skills', p: 'Designers do not only create solutions — they also need to explain their thinking behind those solutions. Presentation Skills are the ability to communicate ideas, explain the design process, and share learning with others. Children practice:' },
        ['Explaining what they created and why.', 'Describing challenges and how they solved them.', 'Demonstrating how their project works.', 'Listening and responding to questions.']

  mod("Module 04", "Plan and Approach", [
    richLesson("Create a Lesson Plan",
      [
        `At Cardboard Maker, each lesson is designed with clear learning goals while allowing children's ideas to shape the creative process. The curriculum progresses step by step, introducing new design challenges, scientific concepts, and interactive mechanisms at a pace that matches each age group's development.`,
        { h: 'Junior Designer (5–7 years)', p: 'Junior Designers begin with project templates that provide a clear starting point. Children personalize each design by changing shapes, adding details, and making creative decisions that reflect their own ideas. Children also explore simple interactive mechanisms. These hands-on experiences introduce the relationship between structure, movement, electricity, and function in a way that is concrete and playful.' },
        { h: 'Chief Imagination (7–10 years)', p: 'Chief Imagination encourages children to develop original projects from their own ideas. They sketch concepts, build prototypes, test different solutions, and refine their designs through repeated iterations. Projects become more open-ended as children apply their understanding of structure, mechanics, and interactive technology. Children learn how different systems work together and apply them to create inventions that respond to movement, light, sound, or touch.' },
        `Across both levels, lesson plans provide a consistent learning pathway while leaving space for creativity and individual expression. Each project strengthens design thinking, problem-solving, collaboration, and scientific inquiry, helping children build confidence through making, testing, and improving their own creations.`
      ],
      [`Choose one project and identify which competency areas it develops.`]
    ),
    richLesson("Start a Project Planning",
      [
        `Every Cardboard Maker project begins with a plan. Before building, children organize their ideas on a one-page Project Planning Sheet. It helps them see the complete project at a glance — from the overall concept to the materials, mechanisms, and interactions they will create. Planning encourages children to think ahead, make design decisions, and break a large idea into manageable steps before construction begins.`,
        { type: 'photo',src: 'assets/image/CardboardMaker_Worksheet_ProjectPlanning.jpg',align: 'full',alt: 'Cardboard Maker Project Planning Sheet'},
        { h: 'Sketch', p: 'Children start by sketching their ideas on an isometric grid, allowing them to visualize their project in three dimensions. Shape stickers provide a simple starting point, while leaving plenty of space to customize, combine, and develop original designs.' },
        { h: 'Assemble', p: 'Children decide how each part of their project will be connected. Different assembly methods support different functions.' },

        { h: 'Interaction', p: 'Finally, children connect the inputs and outputs by planning how the project will behave. This interaction map helps them visualize the flow before they begin building and programming.' },
        `The Project Planning Sheet provides a clear roadmap throughout the making process, thinking through each decision in advance while building confidence to turn their ideas into working prototypes.`,

        { type: 'photo',src: 'assets/image/CardboardMaker_Worksheet_InteractionPlanning.jpg',align: 'full',alt: 'Cardboard Maker Interaction Planning Sheet'},
        { h: 'Inputs', p: 'Children choose the electronic components that control their project, such as push buttons, switches, sensors, or other input devices. They consider how a user will interact with their invention and what actions will trigger a response.' },
        { h: 'Outputs', p: 'Children select the electronic components that respond to the inputs. Outputs may include LEDs, LED strips, motors, buzzers, speakers, or other devices that create movement, light, or sound.' },
        { h: 'Actions', p: 'For every input and output, children define the expected action. For example:' },
        ['Push Button → Double click', 'LED Strip → Blink red'],

        `To support visual thinking, each output has a matching sticker template. Children can sketch exactly what they want the output to do before writing any code. This allows children to communicate interactive ideas visually before turning them into a working program.`,
        { type: 'attach', src: 'assets/files/CardboardMaker_Worksheet_InteractionPlanning.pdf', label: 'Interaction Planning Sheet'}
      ],
      [`Download and print the Interaction Planning Sheet, then plan an interaction of your own project.`]

    richLesson("Designing Visual",
      [
        `The Designing Sheet helps children visualize the appearance of their project before they begin painting. It gives them a space to explore colors, patterns, and visual details while considering how each side of the project will look and function. By planning the design in advance, children develop a clear vision of their finished creation and make more intentional design decisions throughout the making process.`,
        { type: 'photo',src: 'assets/image/CardboardMaker_Worksheet_Designing.jpg',align: 'full',alt: 'Cardboard Maker Designing Sheet'},
        { h: 'Feelings', p: 'Every design begins with an idea or emotion. Children first think about how they want others to feel when they see their project. The inspiration can come from a feeling, a place, a memory, an object, or anything that sparks their imagination. Children record keywords in the Feelings box using adjectives or nouns, creating a simple design direction that guides their later color and pattern choices.' },
        { h: 'Main Color', p: 'Children choose the primary color that will appear most often throughout their project. This becomes the visual foundation of the design and helps create a consistent look across different surfaces and components.' },
        { h: 'Color & Surface Planning', p: 'Children sketch each side of their project and plan where colors, patterns, and decorative details will be applied. They decide which areas will be painted with acrylic paint, acrylic markers, or other art materials, creating an overview of the final appearance before construction is complete.' },
        `The Designing Sheet encourages children to think like designers by connecting ideas, emotions, and visual communication. It helps them make thoughtful creative choices while building confidence in expressing their own artistic style.`,
        { type: 'attach', src: 'assets/files/CardboardMaker_Worksheet_Designing.pdf', label: 'Designing Sheet'}

    richLesson("Set up an Exhibition",
      [
        `Planning an exhibition gives children the opportunity to think beyond their own project and consider the experience of the audience. Working together, they organize ideas, make shared decisions, and create a space that showcases everyone's work. The process encourages collaboration, communication, and planning while helping children see how individual projects become part of a larger story.`,
        { type: 'photo',src: 'assets/image/CardboardMaker_Worksheet_ExhibitionPlanning.jpg',align: 'full',alt: 'Cardboard Maker Exhibition Planning Sheet'},
        { h: 'Theme', p: 'The planning begins with a group brainstorming session. Children decide on a theme, story, or exhibition name that connects all of the projects. A clear theme gives the exhibition a shared identity and helps guide later design decisions.' },
        { h: 'Floor Plan', p: 'Children sketch the exhibition layout and decide where each one will be displayed. This activity encourages them to think about space, organization, and how visitors will experience the exhibition.' },
        { h: 'Visitor Path', p: 'Children design the route they would like visitors to follow. They draw the exhibition path and consider where signs, guideposts, or directions might help visitors move through the space.' },

        ['Arrival — Welcome sign, ticket check, or seating arrangement', 'Presenting — Individual or group project presentations', 'Activity — A showcase, performance, concert, or interactive game', 'Ending — Awards, certificates, reflection, or a closing ceremony'],
        { type: 'attach', src: 'assets/files/CardboardMaker_Worksheet_ExhibitionPlanning.pdf', label: 'Exhibition Planning Sheet'}

      [`Plan a schedule for a Moving Animal Exhibition. Create three possible event schedules.`]

  ]),

  mod("Module 06", "The Magic Maker Kit", [
    richLesson("Magic Maker Device",
      [
        `Magic Maker Device is a beginner-friendly electronic system designed to help children explore interactive design through hands-on making. It combines a mini Arduino circuit board with a simple connection system, allowing children to bring their cardboard creations to life without needing to start with complex electronics.`,
        `The device works as a bridge between physical making and digital technology. It connects with the Magic Maker Platform, where children can create simple commands to control their electronic parts. Instead of building circuits from scratch, children can plug in the provided components and immediately experiment with how technology can enhance their designs. Every interactive system follows a simple process: Input → Brain → Output`,
        { h: 'Input: How the user communicates with the device', p: 'Inputs are the parts that receive information or commands from the user or environment. The Magic Maker Device provides 4 input ports for children to explore different ways of controlling their projects.' },
        { h: 'Brain: How the system thinks and decides', p: 'The brain is the part that connects inputs and outputs together. In the Magic Maker Device, the mini Arduino board acts as the controller that receives information from inputs and follows programmed instructions that start with a simple command: when this happens → make this happen. For example: when the button is pressed → turn on the LED light.' },
        { h: 'Output: How the project responds', p: 'Outputs are the parts that create an action or response. They allow the invention to communicate with the user through movement, light, sound, or other interactions. The Magic Maker Device provides 4 output ports for children to connect different electronic components.' }
      ],
      [`Choose one input and one output from the Magic Maker Device. Write a simple interaction command.`]

    richLesson("Electronic Parts",
      [

        ['Push Button — sends a signal when someone physically presses it. It works like a simple command: pressed or not pressed.', 'Toggle Switch — controls two states, ON and OFF. Unlike a push button that only works while being pressed, a toggle switch keeps its position until it is changed.', 'Distance Sensor — detects how far an object is, allowing a project to respond automatically without someone pressing a button.'],
        { h: 'Outputs', p: '' },
        ['DC Gear Motor — creates continuous spinning movement. The gear system helps control speed and provides stronger movement compared to a simple motor.', 'Servomotor — creates controlled movement by rotating to a specific position. Unlike a DC Gear Motor, it does not continuously spin — it is designed for precise movements.', 'LED Light — creates a visual response through light. It is one of the simplest outputs for children to understand because the result is immediately visible. LEDs can communicate information, create atmosphere, or become part of the character design.', 'Speaker — creates sound output, allowing projects to communicate through audio and adding another layer of interaction.']
      ],
      [`Choose one input and one output from the electronic parts. Write a simple command to describe how your project will respond.`]
    ),
    richLesson("Magic Maker Platform",

        { h: 'Step 1 — Prepare the Magic Maker Device', p: 'Before opening the platform, prepare all necessary equipment:' },
        ['Magic Maker Device and computer', 'USB-C cable', 'Electronic parts (inputs and outputs)'],
        { h: 'Step 2 — Connect the Magic Maker Device', p: 'Follow these steps to connect the device:' },

/* ============================================================

const state = {
  modules: null,
  selModule: 0,
  selLesson: 0,
  loginError: '',          // shared by the single login page
  users: null,             // all platform members (admin + learners)
  loggedIn: false,         // in-memory only — resets on reload by design
  currentUser: null,       // reference into state.users for whoever is logged in
  viewAsUser: false        // admin's "preview as a regular user" toggle — session only
};

const SWATCHES = ['', '#FF6300', '#9EDBFF', '#FCDC67', '#000000'];

/* ---- status tiers (calculated from progress, or manually overridden) ---- */
const STATUS_TIERS = [
  { key:'pro',          label:'Pro',          min:76, color:'#FF6300', fg:'#fff' },
  { key:'advance',      label:'Advance',      min:51, color:'#A4DFDC', fg:'#000' },
  { key:'intermediate', label:'Intermediate', min:26, color:'#FCDC67', fg:'#000' },
  { key:'beginner',     label:'Beginner',     min:0,  color:'#9EDBFF', fg:'#000' }
];
function calcTierFromPct(pct){
  for(const t of STATUS_TIERS) if(pct >= t.min) return t.key;
  return 'beginner';
}
function userProgress(user){
  let total = 0, done = 0;
  state.modules.forEach((m) => {
    m.lessons.forEach((l, li) => {
      total++;
      const mi = state.modules.indexOf(m);
      if(user.completions && user.completions[mi+'-'+li]) done++;
    });
  });
  return { done, total, pct: total ? Math.round((done/total)*100) : 0 };
}
function userStatusKey(user){
  if(!user) return 'beginner';
  if(user.statusOverride) return user.statusOverride; // 'admin' or a pinned tier key
  return calcTierFromPct(userProgress(user).pct);
}
function statusMeta(key){
  if(key === 'admin') return { key:'admin', label:'Admin', color:'#000000', fg:'#fff' };
  return STATUS_TIERS.find(t => t.key === key) || STATUS_TIERS[STATUS_TIERS.length-1];
}
function isAdminUser(user){ return !!user && userStatusKey(user) === 'admin'; }
// Whether editing tools should show right now — true admin status AND not
// currently previewing the site as a regular user.
function canEdit(){ return isAdminUser(state.currentUser) && !state.viewAsUser; }

async function loadModules(){
  const saved = await storageGet('cms-site-data', true);
  if(saved && Array.isArray(saved.modules) && saved.modules.length){
    state.modules = saved.modules;
  } else {
    state.modules = DEFAULT_MODULES;
    await storageSet('cms-site-data', { modules: state.modules }, true);
  }
}
async function persist(){
  await storageSet('cms-site-data', { modules: state.modules }, true);
}
async function loadUsers(){
  const saved = await storageGet('cms-users', true);
  if(saved && Array.isArray(saved) && saved.length){
    // backfill any fields older/partial records might be missing
    state.users = saved.map(u => ({
      id: u.id || uid(),
      name: u.name || 'Member',
      username: u.username || ('member' + Math.floor(Math.random()*1000)),
      password: u.password || 'changeme',
      completions: u.completions || {},
      statusOverride: u.statusOverride !== undefined ? u.statusOverride : null,
      avatar: u.avatar || null,
      todos: u.todos || [],
      todoMemo: u.todoMemo || '',
      events: u.events || {},
      activityLog: u.activityLog || []
    }));
    // safety net: make sure at least one admin always exists
    if(!state.users.some(u => u.statusOverride === 'admin')){
      state.users[0].statusOverride = 'admin';
    }
  } else {
    state.users = [
      { id: uid(), name: 'Program Admin', username: 'admin', password: 'cardboard2026',
        completions: {}, statusOverride: 'admin', avatar: null,
        todos: [], todoMemo: '', events: {}, activityLog: [] }
    ];
  }
  // make sure an "educator" account exists (requested account), regardless of
  // whether this is a fresh install or a continuing session
  if(!state.users.some(u => u.username === 'educator')){
    const educator = {
      id: uid(), name: 'Educator', username: 'educator', password: 'cardboard2026',
      completions: {}, statusOverride: null, avatar: null,
      todos: [], todoMemo: '', events: {}, activityLog: []
    };
    state.users.push(educator);
    logActivity(educator, 'Account created by admin');
  }
  await persistUsers();
}
async function persistUsers(){
  await storageSet('cms-users', state.users, true);
}

async function boot(){
  await loadModules();
  await loadUsers();
  // try to restore an existing session (private storage — scoped to this viewer only)
  try{
    const session = await storageGet('current-session', false);
    if(session && session.userId){
      const u = state.users.find(x => x.id === session.userId);
      if(u){ state.loggedIn = true; state.currentUser = u; }
    }
  } catch(e){ /* no session to restore */ }
  render();
}
boot();

  renderPublic();
}

function styleFor(align, color){
  let s = '';
  if(align) s += `text-align:${align};`;
  if(color) s += `color:${color};`;
  return s;
}

function mediaHTML(media){
  if(!media || !media.src) return '';
  if(media.type === 'image'){
    const align = media.align || 'center';
    let style = 'border-radius:8px;';
    if(align === 'left') style += 'float:left;max-width:48%;margin:4px 16px 12px 0;';
    else if(align === 'right') style += 'float:right;max-width:48%;margin:4px 0 12px 16px;';
    else if(align === 'full') style += 'display:block;width:100%;margin:0 0 16px;';
    else style += 'display:block;max-width:100%;margin:0 auto 16px;';
    return `<div class="media-block"><img src="${media.src}" alt="${escapeHTML(media.alt||'')}" style="${style}"></div>`;
  }
  if(media.type === 'video'){
    const src = media.src;
    const yt = src.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]+)/);
    const vm = src.match(/vimeo\.com\/(\d+)/);
    if(yt) return `<div class="media-block"><iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe></div>`;
    if(vm) return `<div class="media-block"><iframe src="https://player.vimeo.com/video/${vm[1]}" allowfullscreen></iframe></div>`;
    return `<div class="media-block"><video src="${src}" controls></video></div>`;
  }
  return '';
}
function fileHTML(file){
  if(!file || !file.src) return '';
  return `<div class="file-attach">
    <a href="${file.src}" download="${escapeHTML(file.name || 'download')}" target="_blank" rel="noopener">
      📎 Download ${escapeHTML(file.name || 'attachment')}
    </a>
  </div>`;
}

function cardBg(m, mi){

function formatMinutes(mins){
  if(mins < 60) return mins + ' min';
  const h = Math.floor(mins/60), r = mins % 60;
  return h + 'h' + (r ? ' ' + r + 'm' : '');
}

// todos, events, avatar, name) lives on the logged-in user record so it persists.
function defaultPubState(){
  return {
    module: 0, search: '', page: 'me', modal: null,
    todoAdding: false,
    calYear: new Date().getFullYear(),
    calMonth: new Date().getMonth()
  };
}
if(!state.pub) state.pub = defaultPubState();

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isDoneKey(key){ return !!(state.currentUser && state.currentUser.completions[key]); }
function toggleDoneKey(key){
  const u = state.currentUser;
  if(!u) return;
  const [mi, li] = key.split('-').map(Number);
  const lesson = state.modules[mi] && state.modules[mi].lessons[li];
  const title = lesson ? lesson.title.replace(/&amp;/g,'&') : 'a lesson';
  if(u.completions[key]){
    delete u.completions[key];
    logActivity(u, `Un-marked "${title}" complete`);
  } else {
    u.completions[key] = todayStr();
    logActivity(u, `Completed "${title}"`);
  }
}
function overallProgress(){
  let total = 0, done = 0;
  state.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if(isDoneKey(mi+'-'+li)) done++;
    });
  });
  return { done, total, pct: total ? Math.round((done/total)*100) : 0 };
}
function findContinueLesson(){
  for(let mi=0; mi<state.modules.length; mi++){
    for(let li=0; li<state.modules[mi].lessons.length; li++){
      if(!isDoneKey(mi+'-'+li)) return { mi, li };
    }
  }
  return null;
}
function findLatestUpdate(){
  let best = null, bestTime = -Infinity;
  state.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      if(l.updatedAt && l.updatedAt > bestTime){ bestTime = l.updatedAt; best = { mi, li }; }
    });
  });
  return best;
}
function formatRelativeDate(ts){
  if(!ts) return '';
  const diff = Date.now() - ts, day = 86400000;
  if(diff < 3600000) return 'just now';
  if(diff < day) return Math.round(diff/3600000) + 'h ago';
  const days = Math.round(diff/day);
  if(days === 1) return 'yesterday';
  if(days < 30) return days + ' days ago';
  return new Date(ts).toLocaleDateString();
}

/* ---- activity log: "remember all actions each user does" ---- */
function logActivity(user, action){
  if(!user) return;
  if(!Array.isArray(user.activityLog)) user.activityLog = [];
  user.activityLog.unshift({ ts: Date.now(), action });
  if(user.activityLog.length > 50) user.activityLog.length = 50; // cap growth
  persistUsers();
}

    const count = m.lessons.length;
    return `
      <div class="mod-card ${mi===state.pub.module?'active':''}" data-mi="${mi}" style="background:${cardBg(m, mi)}">
        ${admin ? `<button class="mod-card-edit" data-edit-module="${mi}" title="Edit module">✏️</button>` : ''}
        <h3>${escapeHTML(m.title.replace(/&amp;/g,'&'))}</h3>
        <div class="stats">Lessons: ${count}<br>Est. time: ${formatMinutes(count*15)}</div>
        <div class="icon">${moduleIconSVG(mi)}</div>
      </div>`;
  }).join('');
}

function renderSidePanel(){

  const mi = state.pub.module;

  if(!m){ side.innerHTML = ''; return; }

  const doneCount = m.lessons.filter((_, li) => isDoneKey(mi+'-'+li)).length;
  const total = m.lessons.length;
  const pct = total ? Math.round((doneCount/total)*100) : 0;
  const sm = statusMeta(userStatusKey(acc));

  const items = m.lessons.map((l, li) => {

    return `
      <div class="toc-item ${done?'done':''}" data-open-lesson="${key}">
        <span class="no">${String(li+1).padStart(2,'0')}</span>

          <div class="m">Study time: 15 min</div>
        </span>
      </div>`;

  side.innerHTML = `
    <div class="profile-row">
      <div class="avatar">${acc.avatar ? `<img src="${acc.avatar}" alt="">` : acc.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
      <div>
        <div class="who">${escapeHTML(acc.name)}</div>
        <span class="status-badge" style="background:${sm.color};color:${sm.fg};padding:3px 10px;font-size:10px;">${sm.label}</span>
      </div>
    </div>
    <div class="profile-progress">
      <div class="lbl">Progress · ${escapeHTML(m.title.replace(/&amp;/g,'&'))}</div>
      <div class="bar"><div style="width:${pct}%"></div></div>
    </div>
    <h3 class="toc-heading" style="margin-top:22px;">${escapeHTML(m.title.replace(/&amp;/g,'&'))}</h3>
    <p class="toc-sub">Table of content</p>
    ${items || '<div class="nav-empty">No lessons yet.</div>'}
    ${canEdit() ? `<button class="todo-add-trigger" id="add-lesson-btn" style="margin-top:6px;">＋ New lesson</button>` : ''}
  `;

  const addLessonBtn = document.getElementById('add-lesson-btn');
  if(addLessonBtn){
    addLessonBtn.addEventListener('click', async () => {
      const newLesson = lesson('New lesson', 'Write what this lesson teaches…', 'Add a short real-world example…');
      m.lessons.push(newLesson);
      const li = m.lessons.length - 1;
      logActivity(state.currentUser, `Added lesson "${newLesson.title}" to "${m.title.replace(/&amp;/g,'&')}"`);
      await persist();
      renderSidePanel();
      state.pub.modal = { mi, li, editing: true };
      renderModal();
    });
  }
}

    if(!file) return;
    if(file.size > 2 * 1024 * 1024){
      showAlert('That photo is over ~2MB, which is too large for this preview storage. Try a smaller image.');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      acc.avatar = reader.result;
      logActivity(acc, 'Updated profile photo');
      renderAccountPage();
      patchRailAvatar();
    };
    reader.readAsDataURL(file);
  });
  const removeBtn = document.getElementById('acc-avatar-remove');

  document.getElementById('acc-save').addEventListener('click', async () => {

    state.loggedIn = false;
    state.currentUser = null;
    render();
  });
}

/* ---------- Calendar page ---------- */
function renderCalendarPage(){
  const main = document.getElementById('dash-main');
  const side = document.getElementById('dash-side');
  side.style.display = 'block';

  const year = state.pub.calYear, month = state.pub.calMonth;
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = first.toLocaleString('en-US', { month:'long', year:'numeric' });
  const todayKey = todayStr();

  const completionsByDay = {};
  state.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      const d = state.currentUser.completions[mi+'-'+li];
      if(d){ (completionsByDay[d] = completionsByDay[d] || []).push(l.title.replace(/&amp;/g,'&')); }
    });
  });

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="day blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const hasCompletion = !!completionsByDay[key];
    const hasEvent = !!(state.currentUser.events[key] && state.currentUser.events[key].length);
    cells += `
      <div class="day ${key===todayKey?'today':''}" data-day="${key}">
        <span>${d}</span>
        <span class="day-dots">${hasCompletion?'<i class="dot dot-mint"></i>':''}${hasEvent?'<i class="dot dot-orange"></i>':''}</span>
      </div>`;
  }

  main.innerHTML = `
    <div class="placeholder-page">
      <div class="cal-header">
        <h1>Calendar</h1>
        <div class="cal-nav">
          <button class="btn btn-icon" data-action="cal-prev">‹</button>
          <span>${monthName}</span>
          <button class="btn btn-icon" data-action="cal-next">›</button>
        </div>
      </div>
      <p>Click any day to add an event, or see which lessons you completed that day.</p>
      <div class="cal-legend"><span><i class="dot dot-mint"></i> Lesson completed</span><span><i class="dot dot-orange"></i> Event</span></div>
      <div class="cal-grid">
        ${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  `;

  renderCalendarSide();
}

function renderCalendarSide(){
  const side = document.getElementById('dash-side');
  if(!side) return;

  // gather upcoming events (today or later), sorted by date
  const todayKey = todayStr();
  const upcoming = [];
  Object.keys(state.currentUser.events).forEach(dateKey => {
    if(dateKey >= todayKey){
      (state.currentUser.events[dateKey] || []).forEach(ev => upcoming.push({ dateKey, text: ev.text }));
    }
  });
  upcoming.sort((a,b) => a.dateKey.localeCompare(b.dateKey));
  const eventsHTML = upcoming.slice(0, 6).map(ev => `
    <div class="event-row">
      <span>${escapeHTML(ev.text)}</span>
      <span class="event-date">${new Date(ev.dateKey + 'T00:00:00').toLocaleDateString(undefined, { month:'short', day:'numeric' })}</span>
    </div>`).join('');

  side.innerHTML = `
    <div class="events-card">
      <h4>Your Events</h4>
      ${eventsHTML || '<div class="nav-empty">No upcoming events — click a day to add one.</div>'}
    </div>
    ${renderTodoWidget()}
  `;
  wireTodoWidget();
}

function showDayModal(dateKey){
  const completions = [];
  state.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      if(state.currentUser.completions[mi+'-'+li] === dateKey) completions.push(l.title.replace(/&amp;/g,'&'));
    });
  });
  const niceDate = new Date(dateKey + 'T00:00:00').toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box" style="max-width:420px;text-align:left;">
      <p style="font-weight:700;margin-bottom:14px;">${niceDate}</p>
      ${completions.length ? `
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--orange);font-weight:700;margin-bottom:6px;">Lessons completed</div>
        <ul style="margin:0 0 14px;padding-left:18px;font-size:13.5px;">${completions.map(c=>`<li>${escapeHTML(c)}</li>`).join('')}</ul>
      ` : ''}
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;margin-bottom:6px;">Events</div>
      <div id="day-events-list" style="margin-bottom:12px;"></div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="day-event-input" placeholder="Add an event…" style="flex:1;padding:8px 10px;border:2px solid var(--ink);border-radius:6px;font-family:inherit;">
        <button class="btn btn-sm" id="day-event-add">Add</button>
      </div>
      <div class="confirm-actions" style="margin-top:16px;">
        <button class="btn" data-confirm="cancel">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function renderEventsList(){
    const evs = state.currentUser.events[dateKey] || [];
    overlay.querySelector('#day-events-list').innerHTML = evs.length ? evs.map(ev => `
      <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px;">
        <span style="flex:1;">${escapeHTML(ev.text)}</span>
        <button data-del-event="${ev.id}" style="border:none;background:none;cursor:pointer;color:var(--ink-soft);">✕</button>
      </div>`).join('') : '<div style="font-size:12.5px;color:var(--ink-soft);">No events yet.</div>';
  }
  renderEventsList();

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'cancel'){ overlay.remove(); renderCalendarPage(); return; }
    const delBtn = e.target.closest('[data-del-event]');
    if(delBtn){
      state.currentUser.events[dateKey] = (state.currentUser.events[dateKey]||[]).filter(ev => ev.id !== delBtn.dataset.delEvent);
      renderEventsList();
    }
  });
  overlay.querySelector('#day-event-add').addEventListener('click', () => {
    const input = overlay.querySelector('#day-event-input');
    const text = input.value.trim();
    if(!text) return;
    if(!state.currentUser.events[dateKey]) state.currentUser.events[dateKey] = [];
    state.currentUser.events[dateKey].push({ id: uid(), text });
    input.value = '';
    renderEventsList();
  });
}

/* ---------- Lesson popup modal ---------- */
function renderModal(){
  const root = document.getElementById('modal-root');
  if(!root) return;
  const modal = state.pub.modal;
  if(!modal){ root.innerHTML = ''; return; }
  const m = state.modules[modal.mi];
  const l = m && m.lessons[modal.li];
  if(!l){ root.innerHTML = ''; return; }

  if(modal.editing && canEdit()){
    renderLessonEditModal(root, m, l, modal.mi, modal.li);
  } else {
    renderLessonViewModal(root, m, l, modal.mi, modal.li);
  }
}
