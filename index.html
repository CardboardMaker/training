<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardboard Maker · Training for Educators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-note:#FFFFFF;
    --kraft:#A4DFDC;
    --kraft-dark:#000000;
    --ink:#000000;
    --ink-soft:#3A3A3A;
    --orange:#FF6300;
    --sky:#9EDBFF;
    --yellow:#FCDC67;
    --line: rgba(0,0,0,0.16);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Quicksand', sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Quicksand', sans-serif; font-weight:700;}
  a{color:var(--orange);}
  button{font-family:inherit;}

  /* ============ PUBLIC SITE — DASHBOARD SHELL ============ */
  body.public-body{
    background: url("assets/image/sitebackground.png") center center / cover no-repeat fixed;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  .dash-wrap{ position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:45px 20px 25px; }
  .dash-card{
    background:#fffef8; border-radius:28px; box-shadow:0 30px 30px -30px rgba(0,0,0,0.2);
     display:flex; overflow:hidden; aspect-ratio:16/9; width:100%;
  }

  /* sidebar */
  .rail{ width:84px; flex:0 0 auto; background:#000; padding:26px 12px; display:flex; flex-direction:column; align-items:center; }
  .rail .cap svg{ display: none }
  .rail .cap{ width: 34px; height: 34px; margin-bottom: 25px; background: url("assets/image/logo.png") center/contain no-repeat; }
  .rail-main{ display:flex; flex-direction:column; gap:6px; width:100%; align-items:center; }
  .rail-item{
    display:flex; align-items:center; justify-content:center; padding:13px; border-radius:12px; cursor:pointer;
    color:rgba(255,255,255,0.68); width:52px;
  }
  .rail-item svg{ width:20px; height:20px; flex-shrink:0; }
  .rail-avatar{ width:26px; height:26px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .rail-item:hover{ background:rgba(255,255,255,0.07); color:#fff; }
  .rail-item.active{ background:var(--orange); color:#fff; }
  .rail-spacer{ flex:1; }
  .rail-bottom{ border-top:1px solid rgba(255,255,255,0.15); padding-top:10px; margin-top:8px; display:flex; flex-direction:column; gap:6px; width:100%; align-items:center; }
  .rail-version{ color:rgba(255,255,255,0.32); font-size:10px; text-align:center; padding-top:6px; }

  /* main pane */
  .dash-main{ flex:1; min-width:0; background:#FFFFFF; padding:38px 34px; overflow-y:auto; }
  .dash-hello h1{ margin:0 0 4px; font-size:30px; }
  .dash-hello p{ margin:0 0 22px; color:var(--ink-soft); font-size:15px; }
  .dash-search{ position:relative; margin-bottom:26px; }
  .dash-search input{
    width:100%; padding:13px 16px 13px 42px; border-radius:14px; border:1px solid var(--line);
    background:#FFFFFF; font-family:inherit; font-size:14px;
  }
  .dash-search .ic{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:15px; }

  .card-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; }
  .mod-card{
    border-radius:20px; padding:22px; cursor:pointer; position:relative; overflow:hidden;
    min-height:150px; border:2px solid transparent; transition:transform .15s ease;
  }
  .mod-card:hover{ transform:translateY(-2px); }
  .mod-card.active{ border-color:var(--ink); }
  .mod-card h3{ margin:0 0 10px; font-size:19px; }
  .mod-card .stats{ font-size:12.5px; line-height:1.7; color:rgba(0,0,0,0.65); font-weight:600; }
  .mod-card .icon{ position:absolute; right:16px; bottom:12px; width:56px; height:56px; opacity:.9; }

  /* right panel (Modules page TOC) */
  .dash-side{ width:300px; flex:0 0 auto; padding:34px 26px; border-left:1px solid var(--line); overflow-y:auto; }
  .profile-row{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .avatar{
    width:52px; height:52px; border-radius:14px; background:var(--kraft); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; color:#000; overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .profile-row .who{ font-weight:700; font-size:14.5px; }
  .profile-row .role{ font-size:12px; color:var(--ink-soft); }
  .profile-progress{ margin-top:6px; }
  .profile-progress .lbl{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .profile-progress .bar{ height:5px; background:var(--line); border-radius:100px; margin-top:5px; overflow:hidden; }
  .profile-progress .bar > div{ height:100%; background:var(--orange); }

  .toc-heading{ font-size:20px; margin:0 0 2px; }
  .toc-sub{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin:0 0 18px; }
  .toc-item{ display:flex; align-items:flex-start; gap:12px; padding:10px 6px; border-radius:10px; cursor:pointer; }
  .toc-item:hover{ background:rgba(164,223,220,0.2); }
  .toc-item .no{ font-size:26px; font-weight:700; color:var(--kraft); flex:0 0 auto; width:38px; line-height:1; }
  .toc-item .txt .t{ font-size:13.5px; font-weight:700; margin-bottom:2px; }
  .toc-item .txt .m{ font-size:11.5px; color:var(--ink-soft); }
  .toc-item.done .no{ color:var(--orange); }

  /* Me page */
  .me-progress-card{ background:#d9f4ef; border-radius:18px; padding:22px 24px; margin-bottom:22px; }
  .me-progress-top{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px; }
  .me-progress-top .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; }
  .me-progress-top .big{ font-size:30px; font-weight:700; line-height:1; margin-top:4px; }
  .me-progress-sub{ font-size:13px; color:var(--ink-soft); }
  .progress-bar-lg{ height:10px; border-radius:100px; background:var(--line); overflow:hidden; }
  .progress-bar-lg > div{ height:100%; background:var(--orange); border-radius:100px; }

  .me-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; }
  .me-card{ background:#d9f4ef; border-radius:16px; padding:20px; }
  .me-card-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--orange); font-weight:700; margin-bottom:8px; }
  .me-card-title{ font-size:16px; font-weight:700; margin-bottom:2px; }
  .me-card-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
  .me-external-card{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:0;
  }

  /* To-do widget (Calendar page, right column) — clean card style */
  .events-card{ background:#fffef8; border-radius:16px; padding:20px 22px; margin-bottom:18px; }
  .events-card h4{ margin:0 0 12px; font-size:15px; }
  .event-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; padding:8px 0; background:#fffef8; }
  .event-row:last-child{ border-bottom:none; }
  .event-date{ color:var(--ink-soft); font-size:11.5px; white-space:nowrap; flex-shrink:0; }

  .todo-card{ background:#fffef8; border-radius:16px; padding:20px 20px 18px; max-width:100%; box-sizing:border-box; }
  .todo-card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .todo-card-head h4{ margin:0; font-size:19px; font-weight:700; }
  .todo-card-sub{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:11.5px; color:var(--ink-soft); margin:6px 0 12px; flex-wrap:wrap; }

  .todo-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .todo-row:last-child{ border-bottom:none; }
  .todo-row-text{ flex:1; min-width:0; }
  .todo-row-title{ font-size:14px; font-weight:600; color:var(--ink); overflow-wrap:anywhere; }
  .todo-row.done .todo-row-title{ text-decoration:line-through; color:var(--ink-soft); }
  .todo-row-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; cursor:pointer; }
  .todo-row-meta:hover{ color:var(--orange); }

  .todo-check-circle{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:#00593f; background:#fff;
  }
  .todo-check-circle.done{ background:var(--kraft); border-color:var(--kraft); }
  .todo-del-x{ border:none; background:none; cursor:pointer; color:var(--line); font-size:12px; flex-shrink:0; padding:4px; }
  .todo-del-x:hover{ color:var(--orange); }

  .todo-add-row{ margin-top:6px; text-align:center; }
  .todo-add-trigger{
    border:none; background:none; cursor:pointer; font-weight:700; font-size:14px; color:var(--ink);
    padding:10px; display:inline-flex; align-items:center; gap:8px;
  }
  .todo-add-trigger:hover{ color:var(--orange); }
  .todo-add-inline{ display:flex; gap:8px; max-width:100%; }
  .todo-add-inline input{ flex:1; min-width:0; padding:9px 11px; border:2px solid var(--ink); border-radius:8px; font-family:inherit; font-size:13px; box-sizing:border-box; }

  .todo-memo{ margin-top:16px; border-top:1px solid var(--line); padding-top:14px; }
  .todo-memo-label{ color:var(--ink-soft); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .todo-memo textarea{ width:100%; min-height:56px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; resize:vertical; font-family:inherit; font-size:12.5px; box-sizing:border-box; }

  /* lesson popup modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-card{
    background:#fff; border-radius:20px; max-width:560px; width:100%; max-height:85vh; overflow-y:auto;
    padding:30px 30px 28px; position:relative;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%;
    border:2px solid var(--ink); background:#fff; cursor:pointer; font-weight:700; font-size:15px;
  }
  .modal-card .m-eyebrow{ font-size:11px; color:var(--orange); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin:0 0 6px; }
  .modal-card h3{ margin:0 0 6px; font-size:21px; }
  .modal-card .m-subtitle{ margin:0 0 16px; color:var(--ink-soft); font-size:14px; }
  .modal-card .label{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--orange); margin:16px 0 6px; font-weight:700; }
  .modal-card .rte-view{ line-height:1.65; font-size:15px; }
  .modal-card .rte-view p{ margin:0 0 10px; }
  .modal-card .example{ border-top:2px dashed var(--line); padding-top:14px; margin-top:16px; }
  .modal-card .example .label{ color:var(--orange); }
  .modal-card .media-block{ margin:12px 0; }
  .modal-card .media-block::after{ content:""; display:table; clear:both; }
  .modal-card .media-block img{ border-radius:10px; }
  .modal-card .media-block video{ max-width:100%; border-radius:10px; display:block; }
  .modal-card .media-block iframe{ width:100%; aspect-ratio:16/9; border:0; border-radius:10px; display:block; }
  .file-attach{ margin:14px 0; }
  .file-attach a{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    background:var(--kraft); color:#000; font-weight:700; font-size:13.5px;
    padding:9px 16px; border-radius:100px; border:2px solid var(--ink);
  }
  .file-attach a:hover{ opacity:0.85; }
  .modal-mark{ margin-top:20px; text-align:center; }

  /* simple placeholder pages: account / calendar */
  .placeholder-page h1{ font-size:26px; margin:0 0 8px; }
  .placeholder-page p{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; max-width:720px; }
  .account-card{ background:#f2f2f2; border-radius:16px; padding:22px; max-width:720px; margin-top:20px; }
  .account-card .field{ margin-bottom:14px; }
  .avatar-row{ display:flex; align-items:center; gap:18px; margin-bottom:20px; }
  .avatar-big{
    width:76px; height:76px; border-radius:50%; background:var(--kraft); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:22px; color:#000; overflow:hidden;
  }
  .avatar-big img{ width:100%; height:100%; object-fit:cover; }
  
  .cal-header{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; width:100%; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:16px; width:100%; }
  .cal-nav{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:14px; }
  .cal-legend{ display:flex; gap:16px; font-size:12px; color:var(--ink-soft); margin:12px 0 4px; align-items:center; }
  .cal-legend span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .dot-mint{ background:var(--kraft); }
  .dot-orange{ background:var(--orange); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,90px); gap:10px; width:fit-content; }
  .cal-grid .dow{ font-size:11px; text-align:left; color:var(--ink-soft); font-weight:700; text-transform:uppercase; }
  .cal-grid .day{
    aspect-ratio:3/2; border-radius:8px; background:#f2f2f2;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font-size:12.5px; cursor:pointer;
  }
  .cal-grid .day:hover{ border-color:var(--ink); }
  .cal-grid .day.today{ background:var(--orange); color:#fff; border-color:var(--orange); font-weight:700; }
  .cal-grid .day.blank{ border:none; cursor:default; }
  .cal-grid .day-dots{ display:flex; gap:3px; height:7px; }

  footer{ text-align:center; padding:10px 24px 10px; color:var(--ink-soft); font-size:12.5px; position:relative; z-index:1; }

  @media (max-width:900px){
    .dash-card{ flex-direction:column; }
    .rail{ width:100%; flex-direction:row; padding:12px 10px; align-items:center; flex-wrap:wrap; }
    .rail .cap{ margin:0 10px 0 0; }
    .rail-main, .rail-bottom{ flex-direction:row; border:none; margin:0; padding:0; }
    .rail-item{ padding:8px 10px; }
    .rail-spacer{ display:none; }
    .rail-version{ display:none; }
    .dash-side{ border-left:none; border-top:1px solid var(--line); width:100%; }
    .card-grid, .me-grid{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce){ .mod-card{ transition:none; } }

  /* ============ ADMIN ============ */
  .admin-login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:#000; padding:24px; }
  .login-card{ background:#fff; border-radius:10px; padding:36px 32px; width:100%; max-width:380px; box-shadow:0 30px 60px rgba(0,0,0,0.4); }
  .login-card h2{ margin:0 0 4px; font-size:22px; }
  .login-card .sub{ color:var(--ink-soft); font-size:13px; margin:0 0 24px; }
  .login-card label{ display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
  .login-card input{ width:100%; padding:11px 12px; border:2px solid var(--ink); border-radius:6px; font-family:inherit; font-size:14px; }
  .login-card .error{ color:var(--orange); font-size:13px; font-weight:600; margin-top:10px; min-height:16px; }
  .login-card .hint{ margin-top:20px; font-size:12px; color:var(--ink-soft); background:rgba(164,223,220,0.35); border-radius:6px; padding:10px 12px; }

  /* learner login (gates the public dashboard) */
  body.learner-login-body{ background:#F3EEE0; min-height:100vh; }
  .ll-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .ll-card{
    background:#fff; border-radius:28px; overflow:hidden; display:flex; max-width:840px; width:100%;
    min-height:520px; box-shadow:0 30px 70px -30px rgba(0,0,0,0.35);
  }
  .ll-visual{
    flex:1; position:relative; padding:36px; display:flex; flex-direction:column; justify-content:space-between;
    background:
      radial-gradient(circle at 25% 18%, rgba(255,255,255,0.65), transparent 55%),
      radial-gradient(circle at 75% 82%, var(--yellow), transparent 55%),
      radial-gradient(circle at 15% 85%, var(--sky), transparent 55%),
      var(--kraft);
  }
  .ll-mark, .ll-mark-dark{ font-size:26px; font-weight:800; color:#000; }
  .ll-tag-eyebrow{ font-size:13px; font-weight:600; margin:0 0 6px; color:#000; opacity:.75; }
  .ll-tag-title{ font-size:21px; font-weight:800; line-height:1.35; margin:0; max-width:260px; color:#000; }
  .ll-form-side{ flex:1; padding:44px 40px; display:flex; flex-direction:column; justify-content:center; }
  .ll-form-side h2{ margin:14px 0 6px; font-size:24px; }
  .ll-sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 22px; line-height:1.5; }
  .ll-form-side label{ display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
  .ll-form-side input[type=text], .ll-form-side input[type=password]{
    width:100%; padding:11px 12px; border:2px solid var(--ink); border-radius:8px; font-family:inherit; font-size:14px; box-sizing:border-box;
  }
  .ll-pass-wrap{ position:relative; }
  .ll-pass-wrap input{ padding-right:42px; }
  .ll-eye{ position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; font-size:15px; }
  .ll-form-side .error{ color:var(--orange); font-size:13px; font-weight:600; margin-top:10px; min-height:16px; }
  .ll-form-side .hint{ margin-top:14px; font-size:12px; color:var(--ink-soft); background:rgba(164,223,220,0.35); border-radius:6px; padding:10px 12px; }
  .ll-footnote{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:18px; }
  .ll-link{ color:var(--orange); font-weight:700; }
  @media (max-width:720px){
    .ll-card{ flex-direction:column; min-height:0; }
    .ll-visual{ min-height:170px; }
    .ll-form-side{ padding:32px 24px; }
  }

  .btn{ border-radius:100px; border:2px solid var(--ink); background:#fff; color:var(--ink); padding:9px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; }
  .btn:hover{ opacity:0.85; }
  .btn-primary{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .btn-block{ width:100%; margin-top:22px; }
  .btn-sm{ padding:5px 12px; font-size:12px; }
  .btn-icon{ width:28px; height:28px; padding:0; border-radius:6px; font-size:13px; line-height:1; }

  .admin-shell{ display:flex; min-height:100vh; background:#fff; }
  .admin-sidebar{ width:320px; flex:0 0 auto; background:#000; color:#fff; padding:22px 16px; overflow-y:auto; }
  .admin-sidebar h1{ font-size:17px; margin:0 0 2px; color:#fff; }
  .admin-sidebar .tag{ font-size:11px; color:var(--sky); text-transform:uppercase; letter-spacing:.1em; margin:0 0 18px; }
  .sidebar-actions{ display:flex; gap:8px; margin-bottom:18px; }
  .sidebar-actions .btn{ flex:1; font-size:12px; padding:8px 10px; }
  .tree-module{ margin-bottom:6px; border-radius:8px; overflow:hidden; }
  .tree-module-head{
    display:flex; align-items:center; gap:8px; padding:10px 10px; background:rgba(255,255,255,0.06);
    cursor:pointer; border-radius:8px;
  }
  .tree-module-head.active{ background:var(--orange); }
  .tree-module-head .num{ font-size:11px; font-weight:700; opacity:.7; }
  .tree-module-head .name{ flex:1; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tree-lessons{ padding:4px 4px 8px 26px; display:flex; flex-direction:column; gap:2px; }
  .tree-lesson{
    display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:6px; cursor:pointer;
    font-size:12.5px; color:rgba(255,255,255,0.8);
  }
  .tree-lesson.active{ background:var(--sky); color:#000; font-weight:700; }
  .tree-lesson .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tree-reorder{ display:flex; gap:2px; }
  .tree-reorder button{ background:none; border:none; color:inherit; cursor:pointer; font-size:11px; padding:2px 4px; opacity:0.7; }
  .tree-reorder button:hover{ opacity:1; }
  .tree-add-lesson{ margin:2px 0 0 0; font-size:11.5px; color:var(--yellow); background:none; border:none; cursor:pointer; padding:4px 8px; text-align:left; }
  .sidebar-footer{ margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.15); }
  .sidebar-footer a, .sidebar-footer button{ display:block; width:100%; text-align:left; background:none; border:none; color:rgba(255,255,255,0.75); font-size:12.5px; padding:8px 6px; cursor:pointer; text-decoration:none; }

/* ============================================================
   STORAGE LAYER (artifact persistent storage, with in-memory
   fallback so the CMS still works if window.storage is absent)
   ============================================================ */
const memoryDB = {};
const hasStorage = (typeof window !== 'undefined' && !!window.storage);

async function storageGet(key, shared){
  if(hasStorage){
    try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  return memoryDB[key] !== undefined ? memoryDB[key] : null;
}
async function storageSet(key, value, shared){
  if(hasStorage){
    try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
    catch(e){ return false; }
  }
  memoryDB[key] = value;
  return true;
}

function escapeHTML(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
function sanitizeRTE(html){
  // strip script/style tags defensively; contenteditable output otherwise
  return (html || '').replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '');
}
function uid(){ return Math.random().toString(36).slice(2, 9); }

// Native confirm()/alert() are silently blocked inside sandboxed iframes
// (e.g. the Claude.ai artifact preview) unless "allow-modals" is set, which
// we can't rely on — so we build our own lightweight modal versions instead.
function showConfirm(message, onYes, confirmLabel){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${escapeHTML(message)}</p>
      <div class="confirm-actions">
        <button class="btn" data-confirm="cancel">Cancel</button>
        <button class="btn btn-primary" data-confirm="ok">${escapeHTML(confirmLabel || 'Confirm')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'cancel'){ overlay.remove(); return; }
    if(e.target.dataset.confirm === 'ok'){ overlay.remove(); onYes(); }
  });
}
function showAlert(message){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${escapeHTML(message)}</p>
      <div class="confirm-actions">
        <button class="btn btn-primary" data-confirm="ok">OK</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'ok') overlay.remove();
  });
}

// Lets an admin drop a photo at the cursor position inside a rich-text field,
// with a choice of layout (left/right/center/full-width) — used by the
// "🖼 Photo" toolbar button so photos can go anywhere in the text, not just
// in one fixed hero-media slot.
function showImageInsertModal(onInsert){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box" style="max-width:420px;">
      <p style="font-weight:700;">Insert a photo</p>
      <div class="field"><label>Image URL</label><input type="url" id="ins-img-url" placeholder="https://…"></div>
      <div class="hint-box">Or upload a small image (recommended under ~3MB)</div>
      <input type="file" id="ins-img-file" accept="image/*" style="margin:8px 0 4px;">
      <div class="field" style="margin-top:12px;">
        <label>Layout</label>
        <div class="align-group" id="ins-img-align">
          <button data-align="left" class="active">Left</button>
          <button data-align="center">Center</button>
          <button data-align="right">Right</button>
          <button data-align="full">Full width</button>
        </div>
      </div>
      <div class="confirm-actions">
        <button class="btn" data-confirm="cancel">Cancel</button>
        <button class="btn btn-primary" id="ins-img-go">Insert</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  let pendingSrc = '';
  let align = 'left';
  overlay.querySelector('#ins-img-url').addEventListener('input', (e) => { pendingSrc = e.target.value; });
  overlay.querySelector('#ins-img-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 3.5 * 1024 * 1024){
      showAlert('That image is over ~3.5MB — try a smaller file or paste an image URL instead.');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => { pendingSrc = reader.result; };
    reader.readAsDataURL(file);
  });
  overlay.querySelectorAll('#ins-img-align button').forEach(b => {
    b.addEventListener('click', () => {
      overlay.querySelectorAll('#ins-img-align button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      align = b.dataset.align;
    });
  });
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'cancel'){ overlay.remove(); }
  });
  overlay.querySelector('#ins-img-go').addEventListener('click', () => {
    if(!pendingSrc){ showAlert('Add an image URL or upload a file first.'); return; }
    let style = 'border-radius:8px;';
    if(align === 'left') style += 'float:left;max-width:45%;margin:4px 16px 10px 0;';
    else if(align === 'right') style += 'float:right;max-width:45%;margin:4px 0 10px 16px;';
    else if(align === 'full') style += 'display:block;width:100%;margin:12px 0;';
    else style += 'display:block;max-width:80%;margin:12px auto;';
    const html = `<img src="${pendingSrc}" style="${style}">`;
    overlay.remove();
    onInsert(html);
  });
}

function styleFor(align, color){
  let s = '';
  if(align) s += `text-align:${align};`;
  if(color) s += `color:${color};`;
  return s;
}

function mediaHTML(media){
  if(!media || !media.src) return '';
  if(media.type === 'image'){
    const align = media.align || 'center';
    let style = 'border-radius:8px;';
    if(align === 'left') style += 'float:left;max-width:48%;margin:4px 16px 12px 0;';
    else if(align === 'right') style += 'float:right;max-width:48%;margin:4px 0 12px 16px;';
    else if(align === 'full') style += 'display:block;width:100%;margin:0 0 16px;';
    else style += 'display:block;max-width:100%;margin:0 auto 16px;';
    return `<div class="media-block"><img src="${media.src}" alt="${escapeHTML(media.alt||'')}" style="${style}"></div>`;
  }
  if(media.type === 'video'){
    const src = media.src;
    const yt = src.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]+)/);
    const vm = src.match(/vimeo\.com\/(\d+)/);
    if(yt) return `<div class="media-block"><iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe></div>`;
    if(vm) return `<div class="media-block"><iframe src="https://player.vimeo.com/video/${vm[1]}" allowfullscreen></iframe></div>`;
    return `<div class="media-block"><video src="${src}" controls></video></div>`;
  }
  return '';
}
function fileHTML(file){
  if(!file || !file.src) return '';
  return `<div class="file-attach">
    <a href="${file.src}" download="${escapeHTML(file.name || 'download')}" target="_blank" rel="noopener">
      📎 Download ${escapeHTML(file.name || 'attachment')}
    </a>
  </div>`;
}

function formatMinutes(mins){
  if(mins < 60) return mins + ' min';
  const h = Math.floor(mins/60), r = mins % 60;

}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isDoneKey(key){ return !!state.pub.completions[key]; }
function toggleDoneKey(key){
  if(state.pub.completions[key]) delete state.pub.completions[key];
  else state.pub.completions[key] = todayStr();
}
function overallProgress(){
  let total = 0, done = 0;
  state.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if(isDoneKey(mi+'-'+li)) done++;
    });
  });
  return { done, total, pct: total ? Math.round((done/total)*100) : 0 };
}
function findContinueLesson(){
  for(let mi=0; mi<state.modules.length; mi++){
    for(let li=0; li<state.modules[mi].lessons.length; li++){
      if(!isDoneKey(mi+'-'+li)) return { mi, li };
    }
  }
  return null;
}
function findLatestUpdate(){
  let best = null, bestTime = -Infinity;
  state.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      if(l.updatedAt && l.updatedAt > bestTime){ bestTime = l.updatedAt; best = { mi, li }; }
    });
  });
  return best;
}
function formatRelativeDate(ts){
  if(!ts) return '';
  const diff = Date.now() - ts, day = 86400000;
  if(diff < 3600000) return 'just now';
  if(diff < day) return Math.round(diff/3600000) + 'h ago';
  const days = Math.round(diff/day);
  if(days === 1) return 'yesterday';
  if(days < 30) return days + ' days ago';
  return new Date(ts).toLocaleDateString();
}

  const monthName = first.toLocaleString('en-US', { month:'long', year:'numeric' });

  const completionsByDay = {};
  state.modules.forEach((m, mi) => {

      if(d){ (completionsByDay[d] = completionsByDay[d] || []).push(l.title.replace(/&amp;/g,'&')); }
    });
  });

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="day blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const hasCompletion = !!completionsByDay[key];
    const hasEvent = !!(state.pub.events[key] && state.pub.events[key].length);
    cells += `
      <div class="day ${key===todayKey?'today':''}" data-day="${key}">
        <span>${d}</span>
        <span class="day-dots">${hasCompletion?'<i class="dot dot-mint"></i>':''}${hasEvent?'<i class="dot dot-orange"></i>':''}</span>
      </div>`;
  }

  main.innerHTML = `
    <div class="placeholder-page">
      <div class="cal-header">
        <h1>Calendar</h1>
        <div class="cal-nav">
          <button class="btn btn-icon" data-action="cal-prev">‹</button>
          <span>${monthName}</span>
          <button class="btn btn-icon" data-action="cal-next">›</button>
        </div>
      </div>
      <p>Click any day to add an event, or see which lessons you completed that day.</p>
      <div class="cal-legend"><span><i class="dot dot-mint"></i> Lesson completed</span><span><i class="dot dot-orange"></i> Event</span></div>
      <div class="cal-grid">
        ${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  `;

  renderCalendarSide();
}

function renderCalendarSide(){
  const side = document.getElementById('dash-side');
  if(!side) return;

  // gather upcoming events (today or later), sorted by date
  const todayKey = todayStr();
  const upcoming = [];
  Object.keys(state.pub.events).forEach(dateKey => {
    if(dateKey >= todayKey){
      (state.pub.events[dateKey] || []).forEach(ev => upcoming.push({ dateKey, text: ev.text }));
    }
  });
  upcoming.sort((a,b) => a.dateKey.localeCompare(b.dateKey));
  const eventsHTML = upcoming.slice(0, 6).map(ev => `
    <div class="event-row">
      <span>${escapeHTML(ev.text)}</span>
      <span class="event-date">${new Date(ev.dateKey + 'T00:00:00').toLocaleDateString(undefined, { month:'short', day:'numeric' })}</span>
    </div>`).join('');

  side.innerHTML = `
    <div class="events-card">
      <h4>Your Events</h4>
      ${eventsHTML || '<div class="nav-empty">No upcoming events — click a day to add one.</div>'}
    </div>
    ${renderTodoWidget()}
  `;
  wireTodoWidget();
}

function showDayModal(dateKey){
  const completions = [];
  state.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      if(state.pub.completions[mi+'-'+li] === dateKey) completions.push(l.title.replace(/&amp;/g,'&'));
    });
  });
  const niceDate = new Date(dateKey + 'T00:00:00').toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box" style="max-width:420px;text-align:left;">
      <p style="font-weight:700;margin-bottom:14px;">${niceDate}</p>
      ${completions.length ? `
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--orange);font-weight:700;margin-bottom:6px;">Lessons completed</div>
        <ul style="margin:0 0 14px;padding-left:18px;font-size:13.5px;">${completions.map(c=>`<li>${escapeHTML(c)}</li>`).join('')}</ul>
      ` : ''}
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;margin-bottom:6px;">Events</div>
      <div id="day-events-list" style="margin-bottom:12px;"></div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="day-event-input" placeholder="Add an event…" style="flex:1;padding:8px 10px;border:2px solid var(--ink);border-radius:6px;font-family:inherit;">
        <button class="btn btn-sm" id="day-event-add">Add</button>
      </div>
      <div class="confirm-actions" style="margin-top:16px;">
        <button class="btn" data-confirm="cancel">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function renderEventsList(){
    const evs = state.pub.events[dateKey] || [];
    overlay.querySelector('#day-events-list').innerHTML = evs.length ? evs.map(ev => `
      <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px;">
        <span style="flex:1;">${escapeHTML(ev.text)}</span>
        <button data-del-event="${ev.id}" style="border:none;background:none;cursor:pointer;color:var(--ink-soft);">✕</button>
      </div>`).join('') : '<div style="font-size:12.5px;color:var(--ink-soft);">No events yet.</div>';
  }
  renderEventsList();

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay || e.target.dataset.confirm === 'cancel'){ overlay.remove(); renderCalendarPage(); return; }
    const delBtn = e.target.closest('[data-del-event]');
    if(delBtn){
      state.pub.events[dateKey] = (state.pub.events[dateKey]||[]).filter(ev => ev.id !== delBtn.dataset.delEvent);
      renderEventsList();
    }
  });
  overlay.querySelector('#day-event-add').addEventListener('click', () => {
    const input = overlay.querySelector('#day-event-input');
    const text = input.value.trim();
    if(!text) return;
    if(!state.pub.events[dateKey]) state.pub.events[dateKey] = [];
    state.pub.events[dateKey].push({ id: uid(), text });
    input.value = '';
    renderEventsList();
  });
}

/* ---------- click delegation ---------- */
function handlePublicClick(e){
  const railItem = e.target.closest('.rail-item');
  if(railItem){
    const key = railItem.dataset.rail;
    if(key === 'admin'){ location.hash = '#admin'; return; }
    state.pub.page = key;
    renderPublic();
    return;
  }

  const card = e.target.closest('.mod-card');
  if(card){
    state.pub.module = Number(card.dataset.mi);
    renderCardGrid();
    renderSidePanel();
    return;
  }

  const tocItem = e.target.closest('[data-open-lesson]');
  if(tocItem){
    const [mi, li] = tocItem.dataset.openLesson.split('-').map(Number);
    state.pub.modal = { mi, li };
    renderModal();
    return;
  }

  const markBtn = e.target.closest('[data-mark-done]');
  if(markBtn){
    toggleDoneKey(markBtn.dataset.markDone);
    renderModal();
    if(state.pub.page === 'modules') renderSidePanel();
    return;
  }

  if(e.target.matches('[data-close-modal]')){
    state.pub.modal = null;
    renderModal();
    return;
  }

  const calNav = e.target.closest('[data-action="cal-prev"], [data-action="cal-next"]');
  if(calNav){
    const dir = calNav.dataset.action === 'cal-prev' ? -1 : 1;
    let mo = state.pub.calMonth + dir, yr = state.pub.calYear;
    if(mo < 0){ mo = 11; yr--; } if(mo > 11){ mo = 0; yr++; }
    state.pub.calMonth = mo; state.pub.calYear = yr;
    renderCalendarPage();
    return;
  }
  const dayCell = e.target.closest('.cal-grid .day');
  if(dayCell && dayCell.dataset.day){
    showDayModal(dayCell.dataset.day);
    return;
  }

  const openAddBtn = e.target.closest('[data-action="open-add-todo"]');
  if(openAddBtn){
    state.pub.todoAdding = true;
    const row = document.getElementById('todo-add-row');
    if(row){
      row.innerHTML = `
        <div class="todo-add-inline">
          <input type="text" id="todo-input" placeholder="Add a task…">
          <button class="btn btn-sm btn-primary" data-action="submit-todo">Add</button>
        </div>`;
      wireTodoWidget();
    }
    return;
  }
  const submitAddBtn = e.target.closest('[data-action="submit-todo"]');
  if(submitAddBtn){
    const input = document.getElementById('todo-input');
    const text = input.value.trim();
    if(text) state.pub.todos.push({ id: uid(), text, done:false, priority:'med' });
    state.pub.todoAdding = false;
    renderCalendarSide();
    return;
  }
  const todoToggle = e.target.closest('[data-toggle-todo]');
  if(todoToggle){
    const t = state.pub.todos.find(x => x.id === todoToggle.dataset.toggleTodo);
    if(t) t.done = !t.done;
    renderTodoList();
    return;
  }
  const todoDel = e.target.closest('[data-del-todo]');
  if(todoDel){
    state.pub.todos = state.pub.todos.filter(x => x.id !== todoDel.dataset.delTodo);
    renderTodoList();
    return;
  }
  const priorityMeta = e.target.closest('[data-cycle-priority]');
  if(priorityMeta){
    const t = state.pub.todos.find(x => x.id === priorityMeta.dataset.cyclePriority);
    if(t){
      const i = PRIORITY_CYCLE.indexOf(t.priority || 'med');
      t.priority = PRIORITY_CYCLE[(i + 1) % PRIORITY_CYCLE.length];
    }
    renderTodoList();
    return;
  }
}

    renderAccountPanel(main);
  } else if(l){
    renderLessonEditor(main, m, l, state.selModule, state.selLesson);
  } else if(m){
    renderModuleEditor(main, m, state.selModule);
  } else {
    main.innerHTML = `<div class="admin-empty">No modules yet. Use "+ New module" to create your first one.</div>`;
  }

  wireAdminEvents();

function wireAdminEvents(){
  document.getElementById('view-site').addEventListener('click', (e) => { e.preventDefault(); location.hash = ''; });
  document.querySelector('[data-act="logout"]').addEventListener('click', () => { state.authed = false; state.editingAccount=false; state.editingUsers=false; render(); });
  document.querySelector('[data-act="account"]').addEventListener('click', () => { state.editingAccount = true; state.editingUsers = false; state.selLesson = -1; renderAdmin(); });
  document.querySelector('[data-act="manage-users"]').addEventListener('click', () => { state.editingUsers = true; state.editingAccount = false; state.selLesson = -1; renderAdmin(); });
  document.querySelector('[data-act="add-module"]').addEventListener('click', async () => {
    const n = state.modules.length + 1;
    state.modules.push(mod(`Module ${String(n).padStart(2,'0')}`, 'Untitled module', []));
    state.selModule = state.modules.length - 1;
    state.selLesson = -1;
    state.editingAccount = false; state.editingUsers = false;
    state.editingUsers = false;
    await persist();
    renderAdmin();
  });

  document.getElementById('tree').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-act]');
    const treeItem = e.target.closest('.tree-module-head, .tree-lesson');
    if(!btn && treeItem && treeItem.classList.contains('tree-lesson')){
      state.selModule = Number(treeItem.dataset.mi);
      state.selLesson = Number(treeItem.dataset.li);
      state.editingAccount = false; state.editingUsers = false;
      renderAdmin();
      return;
    }
    if(!btn) return;
    const act = btn.dataset.act;
    const mi = btn.dataset.mi !== undefined ? Number(btn.dataset.mi) : null;
    const li = btn.dataset.li !== undefined ? Number(btn.dataset.li) : null;

    if(act === 'sel-module'){
      state.selModule = mi; state.selLesson = -1; state.editingAccount = false; state.editingUsers = false; renderAdmin(); return;
    }
    if(act === 'add-lesson'){
      state.modules[mi].lessons.push(lesson('New lesson', 'Write what this lesson teaches…', 'Add a short real-world example…'));
      state.selModule = mi; state.selLesson = state.modules[mi].lessons.length - 1; state.editingAccount=false;
      await persist(); renderAdmin(); return;
    }
    if(act === 'up-module' && mi > 0){
      [state.modules[mi-1], state.modules[mi]] = [state.modules[mi], state.modules[mi-1]];
      if(state.selModule === mi) state.selModule = mi-1; else if(state.selModule === mi-1) state.selModule = mi;
      await persist(); renderAdmin(); return;
    }
    if(act === 'down-module' && mi < state.modules.length - 1){
      [state.modules[mi+1], state.modules[mi]] = [state.modules[mi], state.modules[mi+1]];
      if(state.selModule === mi) state.selModule = mi+1; else if(state.selModule === mi+1) state.selModule = mi;
      await persist(); renderAdmin(); return;
    }
    if(act === 'del-module'){
      showConfirm(`Delete "${state.modules[mi].title.replace(/&amp;/g,'&')}" and all its lessons?`, async () => {
        state.modules.splice(mi, 1);
        state.selModule = Math.max(0, mi - 1); state.selLesson = -1;
        await persist(); renderAdmin();
      }, 'Delete module');
      return;
    }
    if(act === 'up-lesson' && li > 0){
      const arr = state.modules[mi].lessons;
      [arr[li-1], arr[li]] = [arr[li], arr[li-1]];
      if(state.selModule===mi && state.selLesson===li) state.selLesson = li-1;
      else if(state.selModule===mi && state.selLesson===li-1) state.selLesson = li;
      await persist(); renderAdmin(); return;
    }
    if(act === 'down-lesson'){
      const arr = state.modules[mi].lessons;
      if(li < arr.length - 1){
        [arr[li+1], arr[li]] = [arr[li], arr[li+1]];
        if(state.selModule===mi && state.selLesson===li) state.selLesson = li+1;
        else if(state.selModule===mi && state.selLesson===li+1) state.selLesson = li;
        await persist(); renderAdmin();
      }
      return;
    }
    if(act === 'del-lesson'){
      showConfirm('Delete this lesson?', async () => {
        state.modules[mi].lessons.splice(li, 1);
        if(state.selModule === mi) state.selLesson = -1;
        await persist(); renderAdmin();
      }, 'Delete lesson');
      return;
    }
  });
}

  });
  main.querySelector('#f-accent-custom').addEventListener('input', (e) => { pendingAccent = e.target.value; });

  main.querySelector('#save-module').addEventListener('click', async () => {
    m.eyebrow = main.querySelector('#f-eyebrow').value || m.eyebrow;
    m.title = escapeHTML(main.querySelector('#f-modtitle').value || m.title);
    m.accent = pendingAccent;
    await persist();
    flashToast('toast-mod');
  });
  main.querySelector('#del-module-btn').addEventListener('click', () => {
    document.querySelector(`[data-act="del-module"][data-mi="${mi}"]`).click();
  });
}

/* ---------- lesson editor panel ---------- */
function renderLessonEditor(main, m, l, mi, li){
  main.innerHTML = `
    <div class="panel">
      <div class="path">Module ${mi+1} · Lesson ${mi+1}.${li+1}</div>
      <h2>Edit lesson</h2>

      <div class="field">
        <label>Title</label>
        <input type="text" id="f-title" value="${escapeHTML(l.title.replace(/&amp;/g,'&'))}">
        ${styleControls('title', l.titleAlign, l.titleColor)}
      </div>

      <div class="field">
        <label>Subtitle (optional)</label>
        <input type="text" id="f-subtitle" value="${escapeHTML(l.subtitle)}">
        ${styleControls('subtitle', l.subtitleAlign, l.subtitleColor)}
      </div>

      <div class="field">
        <label>Read me</label>
        ${rteToolbar('learn')}
        <div class="rte" id="rte-learn" contenteditable="true">${sanitizeRTE(l.learnHTML)}</div>
      </div>

      <div class="field">
        <label>Exercise</label>
        ${rteToolbar('example')}
        <div class="rte" id="rte-example" contenteditable="true">${sanitizeRTE(l.exampleHTML)}</div>
      </div>

      <div class="field">
        <label>Media</label>
        <div class="media-tabs">
          <button data-mtab="image" class="active">Image</button>
          <button data-mtab="video">Video</button>
          <button data-mtab="none">None</button>
        </div>
        <div id="media-panel-image" class="media-panel">
          <input type="url" id="img-url" placeholder="Paste an image URL…" value="${l.media && l.media.type==='image' ? l.media.src : ''}">
          <div class="hint-box">Or upload a small image directly (recommended under ~3MB).</div>
          <input type="file" id="img-file" accept="image/*" style="margin-top:8px;">
          <div style="margin-top:12px;">
            <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:6px;">Layout</label>
            <div class="align-group" id="img-align-group">
              <button data-align="left" class="${(l.media && l.media.align)==='left'?'active':''}">Left</button>
              <button data-align="center" class="${!l.media || !l.media.align || l.media.align==='center' ? 'active':''}">Center</button>
              <button data-align="right" class="${(l.media && l.media.align)==='right'?'active':''}">Right</button>
              <button data-align="full" class="${(l.media && l.media.align)==='full'?'active':''}">Full width</button>
            </div>
          </div>
        </div>
        <div id="media-panel-video" class="media-panel" style="display:none;">
          <input type="url" id="video-url" placeholder="Paste a YouTube, Vimeo, or direct video (.mp4) link…" value="${l.media && l.media.type==='video' ? l.media.src : ''}">
          <div class="hint-box">Recommended — links work at any length/size. Direct file upload below is capped to small clips only.</div>
          <input type="file" id="video-file" accept="video/*" style="margin-top:8px;">
        </div>
        <div class="media-preview" id="media-preview">${mediaHTML(l.media) || '<em style="color:var(--ink-soft);font-size:13px;">No media yet</em>'}</div>
      </div>

      <div class="field">
        <label>Attachment (downloadable file)</label>
        <input type="text" id="file-name" placeholder="Display name, e.g. Worksheet.pdf" value="${escapeHTML(l.file ? l.file.name : '')}">
        <input type="url" id="file-url" placeholder="Paste a hosted file URL…" value="${l.file && !String(l.file.src).startsWith('data:') ? l.file.src : ''}" style="margin-top:8px;">
        <div class="hint-box">Or upload a small file directly (recommended under ~3.5MB) — PDFs, worksheets, templates, etc.</div>
        <input type="file" id="file-upload" style="margin-top:8px;">
        <div class="media-preview" id="file-preview">${fileHTML(l.file) || '<em style="color:var(--ink-soft);font-size:13px;">No file attached</em>'}</div>
        <button class="btn btn-sm" id="file-remove" style="margin-top:10px;">Remove attachment</button>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="save-lesson">Save lesson</button>
        <span class="toast" id="toast-lesson">Saved ✓</span>
      </div>
      <div class="danger-zone">
        <button class="btn" id="del-lesson-btn">Delete this lesson</button>
      </div>
    </div>
  `;

  // pending media state
  let pendingMedia = l.media ? JSON.parse(JSON.stringify(l.media)) : null;
  let activeMediaTab = pendingMedia ? pendingMedia.type : 'image';
  setMediaTab(activeMediaTab);

  function setMediaTab(tab){
    activeMediaTab = tab;
    main.querySelectorAll('[data-mtab]').forEach(b => b.classList.toggle('active', b.dataset.mtab === tab));
    main.querySelector('#media-panel-image').style.display = tab === 'image' ? 'block' : 'none';
    main.querySelector('#media-panel-video').style.display = tab === 'video' ? 'block' : 'none';
  }
  main.querySelectorAll('[data-mtab]').forEach(b => b.addEventListener('click', () => setMediaTab(b.dataset.mtab)));

  main.querySelector('#img-url').addEventListener('input', (e) => {
    const align = pendingMedia && pendingMedia.type==='image' ? pendingMedia.align : 'center';
    pendingMedia = e.target.value ? { type:'image', src: e.target.value, alt: l.title, align } : null;
    updatePreview();
  });
  main.querySelector('#img-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 3.5 * 1024 * 1024){
      showAlert('That image is over ~3.5MB, which is too large for this preview storage. Try a smaller file or paste an image URL instead.');
      e.target.value = '';
      return;
    }
    const align = pendingMedia && pendingMedia.type==='image' ? pendingMedia.align : 'center';
    const reader = new FileReader();
    reader.onload = () => {
      pendingMedia = { type:'image', src: reader.result, alt: l.title, align };
      updatePreview();
    };
    reader.readAsDataURL(file);
  });
  main.querySelectorAll('#img-align-group button').forEach(b => {
    b.addEventListener('click', () => {
      main.querySelectorAll('#img-align-group button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if(pendingMedia && pendingMedia.type === 'image'){
        pendingMedia.align = b.dataset.align;
        updatePreview();
      }
    });
  });
  main.querySelector('#video-url').addEventListener('input', (e) => {
    pendingMedia = e.target.value ? { type:'video', src: e.target.value } : null;
    updatePreview();
  });
  main.querySelector('#video-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 3.5 * 1024 * 1024){
      showAlert('That video is over ~3.5MB, which is too large for this preview storage. Please paste a hosted video link instead (YouTube, Vimeo, or a direct .mp4 URL).');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingMedia = { type:'video', src: reader.result };
      updatePreview();
    };
    reader.readAsDataURL(file);
  });
  function updatePreview(){
    main.querySelector('#media-preview').innerHTML = mediaHTML(pendingMedia) || '<em style="color:var(--ink-soft);font-size:13px;">No media yet</em>';
  }

  // pending attachment (downloadable file) state
  let pendingFile = l.file ? JSON.parse(JSON.stringify(l.file)) : null;
  function updateFilePreview(){
    main.querySelector('#file-preview').innerHTML = fileHTML(pendingFile) || '<em style="color:var(--ink-soft);font-size:13px;">No file attached</em>';
  }
  main.querySelector('#file-name').addEventListener('input', (e) => {
    if(!pendingFile) pendingFile = { name:'', src:'' };
    pendingFile.name = e.target.value;
    updateFilePreview();
  });
  main.querySelector('#file-url').addEventListener('input', (e) => {
    if(!pendingFile) pendingFile = { name:'', src:'' };
    pendingFile.src = e.target.value;
    if(!pendingFile.name) pendingFile.name = e.target.value.split('/').pop() || 'file';
    updateFilePreview();
  });
  main.querySelector('#file-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 3.5 * 1024 * 1024){
      showAlert('That file is over ~3.5MB, which is too large for this preview storage. Try a smaller file or paste a hosted link instead.');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingFile = { name: main.querySelector('#file-name').value || file.name, src: reader.result };
      main.querySelector('#file-name').value = pendingFile.name;
      updateFilePreview();
    };
    reader.readAsDataURL(file);
  });
  main.querySelector('#file-remove').addEventListener('click', () => {
    pendingFile = null;
    main.querySelector('#file-name').value = '';
    main.querySelector('#file-url').value = '';
    updateFilePreview();
  });

  // style controls (title/subtitle align + color)
  wireStyleControls(main, 'title', l);
  wireStyleControls(main, 'subtitle', l);

  // rich text toolbars
  wireRTEToolbar(main, 'learn');
  wireRTEToolbar(main, 'example');
  main.querySelectorAll('.rte').forEach(el => {
    el.addEventListener('focus', () => { activeRTE = el; });
  });

  main.querySelector('#save-lesson').addEventListener('click', async () => {
    l.title = escapeHTML(main.querySelector('#f-title').value || l.title);
    l.subtitle = main.querySelector('#f-subtitle').value;
    l.learnHTML = sanitizeRTE(main.querySelector('#rte-learn').innerHTML);
    l.exampleHTML = sanitizeRTE(main.querySelector('#rte-example').innerHTML);
    l.media = pendingMedia;
    l.file = (pendingFile && pendingFile.src) ? pendingFile : null;
    l.updatedAt = Date.now();
    await persist();
    flashToast('toast-lesson');
    // refresh sidebar labels (title may have changed)
    renderAdmin();
  });
  main.querySelector('#del-lesson-btn').addEventListener('click', () => {
    document.querySelector(`[data-act="del-lesson"][data-mi="${mi}"][data-li="${li}"]`).click();
  });
}

function styleControls(field, align, color){
  return `
    <div class="style-row">
      <div class="align-group" data-align-for="${field}">
        <button data-align="left" class="${align==='left'||!align?'active':''}">⟸</button>
        <button data-align="center" class="${align==='center'?'active':''}">≡</button>
        <button data-align="right" class="${align==='right'?'active':''}">⟹</button>
      </div>
      <div class="swatch-row" data-color-for="${field}">
        ${SWATCHES.map(c => `<button class="swatch ${color===c?'active':''}" data-color="${c}" style="background:${c||'#fff'}"></button>`).join('')}
        <input type="color" data-custom-for="${field}" value="${color || '#000000'}">
      </div>
    </div>
  `;
}
function wireStyleControls(main, field, l){
  const alignGroup = main.querySelector(`[data-align-for="${field}"]`);
  alignGroup.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      alignGroup.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      if(field==='title') l.titleAlign = btn.dataset.align; else l.subtitleAlign = btn.dataset.align;
    });
  });
  const colorRow = main.querySelector(`[data-color-for="${field}"]`);
  colorRow.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      colorRow.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
      if(field==='title') l.titleColor = sw.dataset.color; else l.subtitleColor = sw.dataset.color;
    });
  });
  colorRow.querySelector(`[data-custom-for="${field}"]`).addEventListener('input', (e) => {
    if(field==='title') l.titleColor = e.target.value; else l.subtitleColor = e.target.value;
  });
}

function rteToolbar(field){
  return `
    <div class="rte-toolbar" data-toolbar-for="${field}">
      <button class="wide" data-cmd="formatBlock" data-val="H3" title="Title block">Title</button>
      <button class="wide" data-cmd="formatBlock" data-val="H4" title="Subtitle block">Subtitle</button>
      <button class="wide" data-cmd="formatBlock" data-val="P" title="Body text">Text</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="Bold"><b>B</b></button>
      <button data-cmd="italic" title="Italic"><i>I</i></button>
      <button data-cmd="underline" title="Underline"><u>U</u></button>
      <button data-cmd="justifyLeft" title="Align left">⟸</button>
      <button data-cmd="justifyCenter" title="Align center">≡</button>
      <button data-cmd="justifyRight" title="Align right">⟹</button>
      ${SWATCHES.filter(c=>c).map(c => `<button data-cmd="foreColor" data-val="${c}" style="background:${c};width:24px;height:24px;border-radius:50%;"></button>`).join('')}
      <button data-cmd="removeFormat" title="Clear formatting">⨯</button>
      <span class="sep"></span>
      <button class="wide" data-cmd="insertImageBlock" title="Insert a photo anywhere in this text">🖼 Photo</button>
    </div>
  `;
}
function wireRTEToolbar(main, field){
  const bar = main.querySelector(`[data-toolbar-for="${field}"]`);
  const rte = main.querySelector(`#rte-${field}`);
  bar.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      if(btn.dataset.cmd === 'insertImageBlock'){
        rte.focus();
        const sel = window.getSelection();
        let savedRange = null;
        if(sel.rangeCount > 0 && rte.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
        showImageInsertModal((html) => {
          rte.focus();
          if(savedRange){
            const sel2 = window.getSelection();
            sel2.removeAllRanges();
            sel2.addRange(savedRange);
          }
          document.execCommand('insertHTML', false, html);
        });
        return;
      }
      rte.focus();
      document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
    });
  });
}

function flashToast(id){
  const t = document.getElementById(id);
  if(!t) return;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- account settings ---------- */
function renderAccountPanel(main){
  main.innerHTML = `
    <div class="panel">
      <div class="path">Settings</div>
      <h2>Account</h2>
      <div class="field"><label>New username</label><input type="text" id="acc-user" placeholder="admin"></div>
      <div class="field"><label>New password</label><input type="password" id="acc-pass" placeholder="••••••••"></div>
      <div class="action-row">
        <button class="btn btn-primary" id="save-account">Update credentials</button>
        <span class="toast" id="toast-acc">Saved ✓</span>
      </div>
      <div class="warn-box">Reminder: this login only gates the editing UI in this preview — it isn't a substitute for real backend authentication in production.</div>
      <div class="danger-zone">
        <button class="btn" id="reset-content">Reset all content to defaults</button>
      </div>
    </div>
  `;
  main.querySelector('#save-account').addEventListener('click', async () => {
    const u = main.querySelector('#acc-user').value.trim();
    const p = main.querySelector('#acc-pass').value;
    const current = await getCredentials();
    const next = { user: u || current.user, pass: p || current.pass };
    await storageSet('cms-credentials', next, true);
    flashToast('toast-acc');
  });
  main.querySelector('#reset-content').addEventListener('click', () => {
    showConfirm('This replaces ALL modules and lessons with the original defaults. Continue?', async () => {
      state.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
      state.selModule = 0; state.selLesson = 0; state.editingAccount = false; state.editingUsers = false;
      await persist();
      renderAdmin();
    }, 'Reset content');
  });
}

function renderUsersPanel(main){
  const rows = state.users.map(u => `
    <div class="user-row">
      <div class="user-row-info">
        <div class="user-row-name">${escapeHTML(u.name)}</div>
        <div class="user-row-meta">@${escapeHTML(u.username)} · ${escapeHTML(u.role)}</div>
      </div>
      <button class="btn btn-sm" data-del-user="${u.id}">Remove</button>
    </div>
  `).join('');

  main.innerHTML = `
    <div class="panel">
      <div class="path">Users</div>
      <h2>Manage platform users</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;">
        Only people you add here can log in to the lesson site. The CMS itself (this dashboard) stays admin-only,
        separate from these accounts.
      </p>

      <div class="user-list">
        ${rows || '<div class="admin-empty" style="padding:20px 0;">No users yet — add one below.</div>'}
      </div>

      <div class="panel" style="margin-top:26px;">
        <h3 style="margin:0 0 14px;font-size:16px;">Add a user</h3>
        <div class="field"><label>Full name</label><input type="text" id="nu-name" placeholder="Jamie Lee"></div>
        <div class="field"><label>Username</label><input type="text" id="nu-username" placeholder="jamie"></div>
        <div class="field"><label>Password</label><input type="text" id="nu-password" placeholder="Choose a password"></div>
        <div class="field"><label>Role</label><input type="text" id="nu-role" placeholder="Educator"></div>
        <div class="action-row">
          <button class="btn btn-primary" id="add-user-btn">Add user</button>
          <span class="toast" id="toast-user">Added ✓</span>
        </div>
      </div>

      <div class="warn-box">Reminder: like the admin login, this is a UI-level access list for this preview, not hardened production authentication (passwords aren't hashed, etc).</div>
    </div>
  `;

  main.querySelector('#add-user-btn').addEventListener('click', async () => {
    const name = main.querySelector('#nu-name').value.trim();
    const username = main.querySelector('#nu-username').value.trim();
    const password = main.querySelector('#nu-password').value;
    const role = main.querySelector('#nu-role').value.trim() || 'Educator';
    if(!name || !username || !password){
      showAlert('Please fill in name, username, and password before adding a user.');
      return;
    }
    if(state.users.some(u => u.username === username)){
      showAlert('That username is already taken — pick a different one.');
      return;
    }
    state.users.push({ id: uid(), name, username, password, role });
    await persistUsers();
    flashToast('toast-user');
    renderUsersPanel(main);
  });

  main.querySelectorAll('[data-del-user]').forEach(btn => {
    btn.addEventListener('click', () => {
      const u = state.users.find(x => x.id === btn.dataset.delUser);
      showConfirm(`Remove ${u ? u.name : 'this user'}? They won't be able to log in anymore.`, async () => {
        state.users = state.users.filter(x => x.id !== btn.dataset.delUser);
        await persistUsers();
        renderUsersPanel(main);
      }, 'Remove user');
    });
  });
}
</script>
